name: Update MrWestCoin Market

on:
  schedule:
    - cron: '* * * * *'   # every minute — the fastest interval GitHub Actions cron supports
  workflow_dispatch:       # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

concurrency:
  group: mrwestcoin-market-tick
  cancel-in-progress: false   # let queued runs wait their turn instead of overlapping and racing on the git push

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advance the market
        run: node .github/scripts/tick-market.js

      - name: Commit updated market data
        run: |
          git config user.name "mrwestcoin-bot"
          git config user.email "actions@github.com"
          git add market-data.json history/
          git diff --staged --quiet || git commit -m "Update MrWestCoin market data"
          git pull --rebase --autostash
          git push
