name: Pre-seed WestLab cache
# Manual button (Actions tab → Run workflow). Recomputes the catalogue + element×compound reactions with the current engine and commits them in ONE commit.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: westlab-export
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          git config user.name "westos-bot"
          git config user.email "actions@github.com"
          node tools/preseed-lab-cache.js
          git add lab-cache/
          if git diff --staged --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Pre-seed WestLab reaction cache (engine v$(node -e "console.log(require('./.github/scripts/westlab-loader.js')('.').Phys.ENGINE_VERSION)"))"
          git pull --rebase origin main && git push
