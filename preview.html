<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WANTED — Colin West · Poster preview</title>
<link rel="icon" type="image/png" href="assets/icons/News.png">
<link rel="stylesheet" href="os/tokens.css">
<link rel="stylesheet" href="os/poster.css">
<style>
  :root{ color-scheme:dark; }
  html,body{ margin:0; min-height:100%; background:#14100b; color:#efe3cc; font-family:var(--font,system-ui,sans-serif); }
  body{ background:radial-gradient(90% 70% at 50% 0%,#2a2016,#120e09 70%); min-height:100vh; }
  .bar{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 18px; background:rgba(20,16,11,.85); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,.08); }
  .bar b{ flex:1; font-size:14px; letter-spacing:.04em; opacity:.85; }
  .bar button,.bar a{ font:600 13px system-ui; color:#efe3cc; background:rgba(255,255,255,.1); border:0; border-radius:999px; padding:8px 16px; cursor:pointer; text-decoration:none; }
  .bar button:hover,.bar a:hover{ background:rgba(255,255,255,.18); }
  .desk{ padding:34px 16px 70px; display:grid; place-items:start center; }
  /* a window showing the poster, laid out like a printed page (A4 proportions) */
  .window{ width:min(100%,760px); border-radius:12px; overflow:hidden; background:#1d1710; box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 90px rgba(0,0,0,.6); }
  .tb{ height:38px; display:flex; align-items:center; gap:8px; padding:0 13px; background:#2a2118; border-bottom:1px solid rgba(255,255,255,.06); position:relative; }
  .tb i{ width:13px; height:13px; border-radius:50%; display:block; } .tb i:nth-child(1){ background:#ff5f57; } .tb i:nth-child(2){ background:#febc2e; } .tb i:nth-child(3){ background:#28c840; }
  .tb span{ position:absolute; left:0; right:0; text-align:center; font:600 13px system-ui; opacity:.75; pointer-events:none; }
  .stage{ padding:clamp(14px,4vw,40px); background:#3a2e20 repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 6px,transparent 6px 12px); }
  .page{ aspect-ratio:210/297; width:100%; position:relative; box-shadow:0 8px 40px rgba(0,0,0,.5); container-type:inline-size; }
  .page.wp{ padding:7cqw 8cqw; display:flex; flex-direction:column; justify-content:space-between; }
  .page .stamp{ top:5cqw; right:6cqw; font-size:max(8px,1.9cqw); padding:.7cqw 1.4cqw; }
  .page .eyebrow{ font-size:max(8px,1.8cqw); }
  .page h1{ font-size:15cqw; margin:1cqw 0; }
  .page .subject{ font-size:5cqw; }
  .page .rule{ margin:2.2cqw auto; }
  .page .lbl{ font-size:max(9px,1.9cqw); margin:2.4cqw 0 1cqw; }
  .page ul{ font-size:max(11px,2.5cqw); line-height:1.5; }
  .page li b{ font-size:max(10px,2.1cqw); min-width:4.2em; }
  .page .final{ font-size:max(12px,2.8cqw); margin-top:2.4cqw; }
  .page .foot{ font:600 max(8px,1.6cqw) var(--font); letter-spacing:.2em; text-transform:uppercase; opacity:.6; }
  .page .photo{ width:34cqw; height:34cqw; margin:2cqw auto; border:.5cqw solid rgba(43,29,16,.7); background:repeating-linear-gradient(45deg,rgba(43,29,16,.12) 0 1.2cqw,transparent 1.2cqw 2.4cqw),#d7bf8c; display:grid; place-items:center; font:700 max(10px,2.2cqw) var(--serif); letter-spacing:.2em; color:rgba(43,29,16,.55); }
  .page > *{ position:relative; z-index:1; }
  @media print{
    html,body{ background:#fff; } .bar{ display:none; } .desk{ padding:0; } .window{ box-shadow:none; border-radius:0; width:100%; } .tb{ display:none; } .stage{ padding:0; background:none; }
    .page{ box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; } @page{ size:A4; margin:0; }
  }
</style>
</head>
<body>
<div class="bar"><a href="index.html">← Back to WestOS</a><b>Poster preview</b><button id="print">Print / save as PDF</button></div>
<div class="desk">
  <div class="window">
    <div class="tb"><i></i><i></i><i></i><span>WANTED.pdf — Colin West</span></div>
    <div class="stage"><div class="page wp" id="page"></div></div>
  </div>
</div>
<script src="data/wanted-data.js"></script>
<script>
  const W = WANTED_DATA, esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const list = a => '<ul>' + a.map(x => '<li><b>' + esc(x.count) + '</b><span>' + esc(x.text) + '</span></li>').join('') + '</ul>';
  document.getElementById('page').innerHTML =
    '<div><div class="stamp">FEDERAL<br>NOTICE</div><div class="eyebrow">By order of the court</div><h1>WANTED</h1><div class="subject">Colin West</div><div class="rule"></div>' +
    '<div class="photo">PHOTO UNAVAILABLE</div>' +
    '<div class="lbl">Charges</div>' + list(W.charges) + '<div class="lbl">Sentence if apprehended</div>' + list(W.sentence) + '</div>' +
    '<div><div class="final">Missing for ' + esc(W.missingDays) + ' day' + (W.missingDays === 1 ? '' : 's') + '. Your days are numbered.</div><div class="foot" style="margin-top:2.4cqw;text-align:center">Federal notice · The Mr West Files</div></div>';
  document.getElementById('print').onclick = () => window.print();
</script>
</body>
</html>
