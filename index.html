<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0b08">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WestOS — The Mr West Files</title>
<link rel="stylesheet" href="os/tokens.css">
<link rel="stylesheet" href="os/poster.css">
<link rel="stylesheet" href="os/os.css">
</head>
<body>
<div id="stage">
  <div id="device">
    <div id="screen">
      <div class="wall" id="wall0"></div><div class="wall" id="wall1"></div><div class="wall-dim"></div>

      <div id="home">
        <div class="topbar"><button class="pill" id="editBtn"></button><button class="pill" id="doneBtn"></button></div>
        <div class="pages" id="pages"></div>
        <div class="dots" id="dots"></div>
        <div class="dock" id="dock"></div>
      </div>

      <div id="windows"></div>
      <div id="sheetwrap"><div class="scrim"></div><div class="sheet" id="sheet"></div></div>
      <div id="banners"></div>

      <div id="lock" style="display:none">
        <div class="shade"></div>
        <div class="clock"><div class="date" id="lockDate"></div><div class="time" id="lockTime"></div></div>
        <div class="notifs" id="lockNotifs"></div>
        <div class="spin" id="lockSpin"></div>
        <div class="hint" id="lockHint" style="display:none">Swipe up to open</div>
      </div>

      <div id="status"><span id="clk">9:41</span><span class="r"><span class="sync" id="syncIc"></span><span class="gl-wrap"></span><span class="bat"><i></i></span></span></div>
      <div class="island"></div>
      <div id="homebar"><i></i></div>
    </div>
  </div>
</div>

<!-- config, icons and reference data -->
<script src="os/config.js"></script>
<script src="os/icons.js"></script>
<script src="data/wanted-data.js"></script>
<script src="data/periodic-table-data.js"></script>
<script src="data/databook-data.js"></script>
<script src="data/moderation-data.js"></script>
<script src="data/economy-data.js"></script>
<script src="data/chem-data.js"></script>
<script src="data/property-data.js"></script>
<script src="data/news-data.js"></script>
<!-- pure libraries (shared with the GitHub Actions and the tests) -->
<script src="os/lib/market-model.js"></script>
<script src="os/lib/chem.js"></script>
<script src="os/lib/world.js"></script>
<!-- kernel: state, cloud, market, bank, gallery, api -->
<script src="os/kernel/state.js"></script>
<script src="os/kernel/cloud.js"></script>
<script src="os/kernel/market.js"></script>
<script src="os/kernel/bank.js"></script>
<script src="os/kernel/gallery.js"></script>
<script src="os/kernel/api.js"></script>
<!-- home-screen widgets: one file each; add a widget by adding a file and a line here -->
<script src="os/widgets/wanted.js"></script>
<script src="os/widgets/stocks.js"></script>
<script src="os/widgets/bank.js"></script>
<script src="os/widgets/news.js"></script>
<script src="os/widgets/messages.js"></script>
<script src="os/widgets/realestate.js"></script>
<script src="os/widgets/clock.js"></script>
<script src="os/widgets/element.js"></script>
<script src="os/widgets/games.js"></script>
<script src="os/shell.js"></script>
<script src="os/kernel/boot.js"></script>
</body>
</html>
