name: Update MrWestCoin Market

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advance the market
        run: node .github/scripts/tick-market.js

      - name: Commit updated market data
        run: |
          git config user.name "mrwestcoin-bot"
          git config user.email "actions@github.com"
          git add market-data.json
          git diff --staged --quiet || git commit -m "Update MrWestCoin market data"
          git push
