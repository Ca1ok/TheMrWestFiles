<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real Estate</title>
<link rel="stylesheet" href="../os/tokens.css"><link rel="stylesheet" href="../os/app/kit.css">
<style>
.sum{ background:linear-gradient(150deg,#b07a56,#6b3f27); color:#fff; border-radius:var(--r-xl); padding:20px; box-shadow:var(--shadow); position:relative; overflow:hidden; } .sum::after{ content:""; position:absolute; right:-40px; bottom:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%); }
.sum small{ opacity:.75; font:600 12.5px var(--font); text-transform:uppercase; letter-spacing:.05em; } .sum .bignum{ font-size:38px; margin:3px 0 10px; } .sum .btn{ background:rgba(255,255,255,.22); height:38px; }
.sec-scroll{ display:flex; gap:10px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; } .sec-scroll::-webkit-scrollbar{ display:none; }
.idx{ flex:none; width:152px; background:var(--card); border-radius:18px; padding:12px; text-align:left; transition:transform .25s var(--spring),box-shadow .2s; } .idx:active{ transform:scale(.96); } .idx.on{ box-shadow:0 0 0 2px var(--c); } .idx b{ font:700 14px var(--font); } .idx .v{ font:700 20px var(--font); font-variant-numeric:tabular-nums; margin-top:2px; } .idx .v span{ font-size:13px; } .idx canvas{ width:100%; height:34px; display:block; margin-top:4px; }
.lists{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
.prop{ background:var(--card); border-radius:20px; padding:14px; text-align:left; position:relative; overflow:hidden; transition:transform .25s var(--spring); display:flex; flex-direction:column; gap:6px; } .prop:active{ transform:scale(.97); }
.prop::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c); } .prop .pn{ font:700 17px/1.2 var(--font); padding-left:6px; } .prop .pp{ font:800 22px var(--font); letter-spacing:-.02em; padding-left:6px; font-variant-numeric:tabular-nums; } .prop .pm{ padding-left:6px; display:flex; gap:8px; align-items:center; font:500 13px var(--font); color:var(--label2); } .prop canvas{ width:100%; height:36px; display:block; }
.own{ position:absolute; top:12px; right:12px; } .dchart{ height:170px; margin:6px 0 10px; } .dp{ font:800 40px/1 var(--font); letter-spacing:-.03em; }
</style></head><body><div id="app"></div>
<script src="../os/icons.js"></script><script src="../os/app/kit.js"></script>
<script>
const { h, row, group, money, esc } = Kit, P = OS.props, SEC = OS.data.PROPERTY_SECTORS, DAY = 86400000;
let filter = 'all';
const pct = (a, b) => b ? (a - b) / b * 100 : 0, chgTag = p => h('span', { class: p >= 0 ? 'up' : 'down' }, (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(1) + '%');
function sectorSeries(sec, days, n){ const now = OS.now(), out = []; for(let i = 0; i <= n; i++){ const t = now - days * DAY + days * DAY * i / n; out.push([t, OS.worldModel.sectorIndex(sec, t) * 100]); } return out; }
const A = Kit.app({ title: 'Real Estate', right: [{ el: Kit.cashChip() }], build: (body) => {
  const sum = h('div'), idx = h('div'), list = h('div'), news = h('div'); body.append(sum, h('h2', { class: 'sec' }, 'Market'), idx, h('h2', { class: 'sec' }, 'Listings'), list, news);
  function paintSum(){
    const own = P.list().filter(p => p.owned), val = P.value(), rent = P.rentDue(), paid = own.reduce((s, p) => s + p.paid, 0), gain = own.reduce((s, p) => s + P.sellValue(p.id) - p.paid, 0);
    sum.innerHTML = ''; sum.appendChild(h('div', { class: 'sum' }, h('small', null, 'Your property'), h('div', { class: 'bignum num' }, own.length ? money(val, { compact: true }) : '$0'),
      h('div', { class: 'hstack', style: { justifyContent: 'space-between', flexWrap: 'wrap' } }, h('div', { style: { opacity: .85, font: '500 14px var(--font)' } }, own.length ? own.length + (own.length === 1 ? ' property' : ' properties') + ' · ' + (gain >= 0 ? '+' : '−') + money(Math.abs(gain), { compact: true }) + ' vs. paid' : 'Buy your first property below'), h('button', { class: 'btn', style: rent < 0.01 ? { opacity: .4 } : {}, onclick: () => { const r = P.collectRent(); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); } }, 'Collect rent ' + money(rent, { dp: 2 })))));
  }
  function paintIdx(){
    idx.innerHTML = ''; const box = h('div', { class: 'sec-scroll' }); box.appendChild(h('button', { class: 'idx' + (filter === 'all' ? ' on' : ''), style: { '--c': 'var(--tint)' }, onclick: () => { filter = 'all'; paintIdx(); paintList(); } }, h('b', null, 'All sectors'), h('div', { class: 'v' }, P.list().length + ' listings'), h('small', { class: 'dim' }, 'Tap a sector to filter')));
    Object.keys(SEC).forEach(k => { const s = sectorSeries(k, 14, 28), now = s[s.length - 1][1], ch = pct(now, s[0][1]), cv = h('canvas'); box.appendChild(h('button', { class: 'idx' + (filter === k ? ' on' : ''), style: { '--c': SEC[k].color }, onclick: () => { filter = k; paintIdx(); paintList(); } }, h('b', { style: { color: SEC[k].color } }, SEC[k].name), h('div', { class: 'v' }, now.toFixed(1), ' ', chgTag(ch)), cv)); requestAnimationFrame(() => Kit.spark(cv, s, ch >= 0 ? 'var(--good)' : 'var(--bad)')); });
    idx.appendChild(box);
  }
  function paintList(){
    list.innerHTML = ''; const rows = P.list().filter(p => filter === 'all' || p.sector === filter);
    list.appendChild(h('div', { class: 'lists' }, ...rows.map(p => { const hist = P.history(p.id, 7, 14), ch = pct(p.price, hist[0][1]), cv = h('canvas');
      const el = h('button', { class: 'prop reveal', style: { '--c': SEC[p.sector].color }, onclick: () => open(p.id) }, p.owned ? h('span', { class: 'tag good own' }, 'Owned') : null, h('div', { class: 'pn' }, p.name), h('div', { class: 'pp' }, money(p.price, { compact: p.price >= 1e6 })), h('div', { class: 'pm' }, h('span', null, SEC[p.sector].name), chgTag(ch), h('span', null, '· rent ' + money(p.price * p.rate, { dp: 0 }) + '/day')), cv); requestAnimationFrame(() => Kit.spark(cv, hist, ch >= 0 ? 'var(--good)' : 'var(--bad)')); return el; })));
  }
  function paintNews(){
    news.innerHTML = ''; const imp = OS.world.impacts().filter(a => a.impact.sector).reverse().slice(0, 4); if(!imp.length) return;
    news.appendChild(h('h2', { class: 'sec' }, 'Property headlines', h('a', { onclick: () => OS.open('News') }, 'All news'))); news.appendChild(group(imp.map(a => row({ title: a.headline, wrap: true, sub: SEC[a.impact.sector].name + ' · ' + Kit.ago(a.t), right: h('span', { class: 'tag ' + (a.impact.pct >= 0 ? 'good' : 'bad') }, (a.impact.pct >= 0 ? '+' : '−') + Math.abs(a.impact.pct * 100).toFixed(0) + '%') }))));
  }
  function open(id){
    const p0 = P.list().find(x => x.id === id);
    A.push({ title: p0.name, large: false, backLabel: 'Listings', build: (b, pg) => {
      const top = h('div'), cv = h('canvas', { class: 'chart dchart' }), info = h('div'), act = h('div'); b.append(top, cv, h('div', { style: { display: 'flex', gap: '8px', margin: '0 0 14px' } }), info, act);
      let range = 30; const rs = Kit.seg([{ id: 7, label: '1W' }, { id: 30, label: '1M' }, { id: 90, label: '3M' }], range, v => { range = +v; draw(); }); b.insertBefore(rs, info);
      function draw(){ const p = P.list().find(x => x.id === id), hist = P.history(id, range, 60), ch = pct(p.price, hist[0][1]);
        top.innerHTML = ''; top.appendChild(h('div', { class: 'hstack', style: { justifyContent: 'space-between', flexWrap: 'wrap' } }, h('div', null, h('div', { class: 'tag', style: { background: SEC[p.sector].color + '33', color: SEC[p.sector].color } }, SEC[p.sector].name), h('div', { class: 'dp num', style: { marginTop: '8px' } }, money(p.price, { dp: 0 })), h('div', { class: 'num', style: { marginTop: '4px', fontWeight: 600 } }, chgTag(ch), h('span', { class: 'dim' }, ' past ' + (range === 7 ? 'week' : range === 30 ? 'month' : '3 months')))), h('div', { class: 'sub', style: { maxWidth: '300px' } }, p.desc)));
        Kit.spark(cv, hist, ch >= 0 ? 'var(--good)' : 'var(--bad)');
        info.innerHTML = ''; info.appendChild(group(row({ title: 'Rent', sub: 'Paid into your account while you own it', right: money(p.price * p.rate, { dp: 0 }) + ' / day' }), row({ title: 'Yearly yield', right: (p.rate * 365 * 100).toFixed(0) + '%' }), p.owned ? row({ title: 'You paid', right: money(p.paid, { dp: 0 }) }) : null, p.owned ? row({ title: 'Sells for', sub: 'The agent takes 5%', right: h('span', { class: P.sellValue(id) >= p.paid ? 'up' : 'down' }, money(P.sellValue(id), { dp: 0 })) }) : null));
        act.innerHTML = ''; act.appendChild(p.owned ? h('button', { class: 'btn block bad', style: { marginTop: '14px' }, onclick: async () => { if(await Kit.confirm({ title: 'Sell ' + p.name + '?', msg: 'You’ll receive ' + money(P.sellValue(id), { dp: 0 }) + ' plus any unpaid rent.', ok: 'Sell', destructive: true })){ const r = P.sell(id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); A.pop(); } } }, 'Sell for ' + money(P.sellValue(id), { dp: 0 })) : h('button', { class: 'btn block', style: { marginTop: '14px' }, onclick: async () => { if(await Kit.confirm({ title: 'Buy ' + p.name + '?', msg: 'It costs ' + money(p.price, { dp: 0 }) + '. You earn rent every day you own it.', ok: 'Buy' })){ const r = P.buy(id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); draw(); } } }, 'Buy for ' + money(p.price, { dp: 0 })));
      }
      draw(); new ResizeObserver(() => draw()).observe(cv);
    } });
  }
  paintSum(); paintIdx(); paintList(); paintNews(); ['props', 'cash'].forEach(e => Kit.live(e, Kit.debounce(() => { paintSum(); paintList(); }, 100))); setInterval(() => { paintSum(); }, 20000);
} });
</script></body></html>
