  /* ---------- maintenance mode (admin) ---------- */
  function maintSummary(){
    try{ const c = OS.admin.maintenanceGet(), n = Object.keys(c.apps).length + Object.keys(c.sys).length; return c.all ? 'The whole website is switched OFF for players' : (n ? n + ' thing' + (n === 1 ? ' is' : 's are') + ' switched off' : 'Everything is on'); }catch(e){ return 'Close the site, apps or systems for players'; }
  }
  function openMaintenance(){
    A.push({ title: 'Maintenance mode', backLabel: 'Settings', build: (b) => {
      const c = OS.admin.maintenanceGet(), M = OS.maintenance, msg = h('div', { class: 'foot', style: { minHeight: '20px' } });
      const say = (m, ok) => { msg.style.color = ok ? 'var(--good)' : 'var(--bad)'; msg.textContent = m; };
      const all = toggle(!!c.all), sys = {}, apps = {}, locked = new Set(M.lockedApps()), systems = M.systems();
      Object.keys(systems).forEach(k => { sys[k] = toggle(!!c.sys[k]); });
      OS.apps().filter(a => !locked.has(a.id)).forEach(a => { apps[a.id] = toggle(!!c.apps[a.id]); });
      const note = h('input', { class: 'field', placeholder: 'Optional note for players, e.g. Back at 6pm', maxlength: 160, value: c.msg || '' });
      const on = t => t.classList.contains('on'), read = () => ({ all: on(all), apps: Object.keys(apps).filter(k => on(apps[k])), sys: Object.keys(sys).filter(k => on(sys[k])), msg: note.value.trim() });
      const save = async (payload, done) => { try{ await OS.admin.maintenanceSet(payload); say(done, true); paintRest(); }catch(e){ say(e.message || 'Couldn’t save — has the maintenance rule been added to the database rules?'); } };
      b.append(h('p', { class: 'sub' }, 'Players get a notice saying the app is in maintenance mode instead of it opening. You (the admin) are never blocked, so you can keep testing. Changes reach everyone who is online within a couple of seconds.'),
        h('div', { class: 'cap' }, 'Whole website'),
        group(row({ title: 'Close the entire website', sub: 'Everyone except you gets a full-screen maintenance notice and nothing runs for them.', wrap: true, right: all })),
        h('div', { class: 'cap' }, 'Systems'),
        group(Object.keys(systems).map(k => row({ title: systems[k], sub: k === 'trading' ? 'Buying and selling $WEST shares' : 'Listing, buying and collecting on the player Market', right: sys[k] }))),
        h('div', { class: 'cap' }, 'Apps'),
        group(OS.apps().filter(a => !locked.has(a.id)).map(a => row({ left: h('span', { html: Kit.tile(a.id, 34) }), title: a.name, right: apps[a.id] }))),
        h('div', { class: 'foot' }, 'Settings and Bank can’t be switched off on their own: Settings is your switchboard, and tax bills must always stay payable. Closing the whole website does cover them.'),
        h('div', { class: 'cap' }, 'Message'), note,
        h('div', { class: 'stack', style: { marginTop: '14px' } }, h('button', { class: 'btn', onclick: () => { const p = read(); save(p, p.all ? 'Website closed for players.' : (p.apps.length || p.sys.length ? 'Saved — the selected items are in maintenance mode.' : 'Saved — everything is on.')); } }, 'Save'),
          h('button', { class: 'btn gray', onclick: () => { Object.keys(apps).forEach(k => apps[k].set(false)); Object.keys(sys).forEach(k => sys[k].set(false)); all.set(false); save({ all: false, apps: [], sys: [], msg: '' }, 'Everything is back on.'); note.value = ''; } }, 'Turn everything back on')), msg);
    } });
  }
  function openAdmin(){
    A.push({ title: 'Admin tools', backLabel: 'Settings', build: (b) => {
      // market
      const lvl = h('select', { class: 'field' }, ...OS.admin.volLevels().map(l => h('option', { value: l }, l[0].toUpperCase() + l.slice(1)))); lvl.value = OS.admin.volatility();
      const cur = h('b', null, OS.admin.volatility()), msg = h('div', { class: 'foot' });
      const delta = h('input', { class: 'field', type: 'number', placeholder: 'Price shove (e.g. 25 or −25)', step: 'any' }), fade = h('input', { class: 'field', type: 'number', placeholder: 'Fade seconds (optional)' });
      const say = (m, ok) => { msg.style.color = ok ? 'var(--good)' : 'var(--bad)'; msg.textContent = m; };
      b.append(h('div', { class: 'cap' }, 'Market volatility (everyone)'), h('p', { class: 'sub' }, 'Only you can see or change this. It applies to every player at the same moment and never re-prices old history.'),
        h('div', { class: 'hstack' }, lvl, h('button', { class: 'btn', onclick: async () => { try{ await OS.admin.setVolatility(lvl.value); say('Volatility set to ' + lvl.value + '.', true); }catch(e){ say(e.message); } } }, 'Apply')), msg,
        h('div', { class: 'cap' }, 'Price shove'), h('div', { class: 'stack' }, delta, fade, h('button', { class: 'btn gray', onclick: async () => { const d = parseFloat(delta.value); if(!isFinite(d) || d === 0) return say('Enter a non-zero number.'); try{ await OS.admin.adjustPrice(d, parseFloat(fade.value) || 0); say('Applied ' + (d > 0 ? '+' : '') + d + '.', true); }catch(e){ say(e.message); } } }, 'Apply price shove')));
      // arcade limits
      const cz = h('div', { class: 'stack' }), cmsg = h('div', { class: 'foot' }); b.append(h('div', { class: 'cap' }, 'Arcade limits (everyone)'), h('p', { class: 'sub' }, 'Only you can change these. The same limits are enforced again by the database rules on every arcade save, so editing the page can’t get around them.'), cz, cmsg);
      OS.admin.arcadeGet().then(c => {
        const num = (v, step) => h('input', { class: 'field', type: 'number', step: step || 'any', value: String(v), style: { maxWidth: '150px', textAlign: 'right' } });
        const fld = (label, ctl, hint) => h('div', null, h('div', { class: 'hstack' }, h('span', { class: 'grow' }, label), ctl), hint ? h('div', { class: 'foot', style: { margin: '2px 0 0' } }, hint) : null);
        const en = Kit.toggle(c.enabled), gs = { slots: Kit.toggle(c.games.slots), blackjack: Kit.toggle(c.games.blackjack), bus: Kit.toggle(c.games.bus), poker: Kit.toggle(c.games.poker) };
        const pct = num(Math.round(c.betPct * 1000) / 10), cap = num(c.betCap, 1), min = num(c.minBet, 1), day = num(c.dailyCap, 1), cd = num(c.cooldownMs / 1000, 0.1), mm = num(c.maxMult, 1);
        cz.append(fld('Arcade open', en), fld('Slots', gs.slots), fld('Blackjack', gs.blackjack), fld('Ride the Bus', gs.bus), fld('Poker', gs.poker),
          fld('Max bet (% of bank)', pct, 'Largest stake as a share of the player’s bank cash.'), fld('Max bet hard cap ($)', cap, 'The percentage above never goes past this.'), fld('Minimum bet ($)', min),
          fld('Daily net winnings cap ($)', day, 'Most a player can be UP per UTC day. Winnings past it are trimmed; losses open the room back up.'), fld('Cooldown between rounds (s)', cd, 'Also enforced server-side.'), fld('Max payout multiplier (×)', mm, 'No round pays more than this × the stake.'),
          h('button', { class: 'btn', onclick: async () => { try{ await OS.admin.arcadeSet({ enabled: en.classList.contains('on'), games: { slots: gs.slots.classList.contains('on'), blackjack: gs.blackjack.classList.contains('on'), bus: gs.bus.classList.contains('on'), poker: gs.poker.classList.contains('on') }, betPct: parseFloat(pct.value) / 100, betCap: parseFloat(cap.value), minBet: parseFloat(min.value), dailyCap: parseFloat(day.value), cooldownMs: parseFloat(cd.value) * 1000, maxMult: parseFloat(mm.value) }); cmsg.style.color = 'var(--good)'; cmsg.textContent = 'Arcade limits saved. Players pick them up within a minute.'; }catch(e){ cmsg.style.color = 'var(--bad)'; cmsg.textContent = e.message; } } }, 'Save arcade limits'));
      }).catch(e => { cmsg.style.color = 'var(--bad)'; cmsg.textContent = e.message; });
      // broadcast
      const bs = h('input', { class: 'field', placeholder: 'Subject' }), bb = h('textarea', { class: 'field', placeholder: 'Message to all players' });
      b.append(h('div', { class: 'cap' }, 'Broadcast message'), h('div', { class: 'stack' }, bs, bb, h('button', { class: 'btn', onclick: async () => { if(!bs.value.trim()) return Kit.toast('Add a subject'); try{ await OS.admin.broadcast(bs.value, bb.value); bs.value = bb.value = ''; Kit.toast('Broadcast sent', 'good'); }catch(e){ Kit.toast(e.message, 'bad'); } } }, 'Send to everyone')));
      b.append(h('div', { class: 'cap' }, 'More'), group(row({ glyph: 'files', color: '#2d6bb8', title: 'Players & server data', sub: 'Open the Files app', chev: true, onClick: () => OS.open('Files') }), row({ glyph: 'photos', color: '#c23b6b', title: 'Photo archive', sub: 'Upload and manage in Photos', chev: true, onClick: () => OS.open('Photos') })));
    } });
  }
  paintAcct(); paintRest(); Kit.live('auth', () => { paintAcct(); paintRest(); }); Kit.live('prefs', Kit.debounce(() => {}, 100));
} });
</script></body></html>
