<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title>
<link rel="stylesheet" href="../os/tokens.css"><link rel="stylesheet" href="../os/app/kit.css">
<style>
.acct{ display:flex; align-items:center; gap:14px; padding:16px; } .acct .av{ width:62px; height:62px; border-radius:50%; background:linear-gradient(160deg,var(--tint2),var(--tint)); display:grid; place-items:center; color:#fff; font:700 26px var(--font); flex:none; overflow:hidden; } .acct .av img{ width:100%; height:100%; object-fit:cover; }
.warnbox{ background:var(--tint-dim); color:var(--tint); border-radius:var(--r-m); padding:11px 14px; font:500 14px/1.35 var(--font); margin-top:10px; }
.wp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; } .wp-cell{ aspect-ratio:3/4; border-radius:16px; background:var(--card2) center/cover; position:relative; overflow:hidden; transition:transform .25s var(--spring); } .wp-cell:active{ transform:scale(.95); }
.wp-cell.on{ box-shadow:0 0 0 3px var(--tint); } .wp-cell .ck{ position:absolute; right:7px; bottom:7px; width:24px; height:24px; border-radius:50%; background:var(--tint); display:none; place-items:center; color:#fff; } .wp-cell.on .ck{ display:grid; }
.wp-cell span{ position:absolute; left:8px; bottom:8px; font:600 12px var(--font); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); }
.wp-prev{ display:flex; gap:12px; justify-content:center; margin:6px 0 14px; } .wp-prev>div{ width:100px; aspect-ratio:3/5; border-radius:18px; background:var(--card2) center/cover; box-shadow:inset 0 0 0 1px var(--sep); position:relative; overflow:hidden; } .wp-prev small{ position:absolute; bottom:6px; left:0; right:0; text-align:center; color:#fff; font:600 11px var(--font); text-shadow:0 1px 3px #000; }
</style></head><body><div id="app"></div>
<script src="../os/icons.js"></script><script src="../os/app/kit.js"></script>
<script>
const { h, row, group, money, esc, toggle, seg } = Kit, P_ = OS.prefs;
const A = Kit.app({ title: 'Settings', build: (body) => {
  const acct = h('div'), rest = h('div'); body.append(acct, rest);

  /* ---------- account ---------- */
  function paintAcct(){
    acct.innerHTML = ''; const u = OS.auth.user();
    if(u){
      const nm = OS.auth.name() || u.email.split('@')[0];
      acct.appendChild(group(h('button', { class: 'row acct', onclick: openAccount }, h('div', { class: 'av', html: u.photo ? '<img src="' + esc(u.photo) + '" referrerpolicy="no-referrer">' : esc(nm[0].toUpperCase()) }), h('div', { class: 'tx' }, h('b', { style: { fontSize: '20px' } }, nm), h('small', null, u.email + ' · progress is saved')), h('span', { class: 'chev', html: Kit.icon('chevR', 18, 2.4) }))));
      if(OS.auth.isAdmin()) acct.appendChild(h('div', { class: 'foot' }, 'Signed in as administrator. Admin tools are at the bottom of this page.'));
    } else {
      acct.appendChild(group(h('button', { class: 'row acct', onclick: openSignIn }, h('div', { class: 'av', html: Kit.icon('user', 30, 1.8) }), h('div', { class: 'tx' }, h('b', { style: { fontSize: '19px' } }, 'Sign in'), h('small', { class: 'wrap' }, 'Save your progress and play on any device')), h('span', { class: 'chev', html: Kit.icon('chevR', 18, 2.4) }))));
      acct.appendChild(h('div', { class: 'warnbox' }, 'You’re playing as a guest. Nothing is saved or cached — closing this tab erases your progress.'));
    }
  }
  function openSignIn(){
    A.push({ title: 'Sign in', large: true, backLabel: 'Settings', build: (b) => {
      const msg = h('div', { class: 'foot', style: { color: 'var(--bad)', minHeight: '20px', textAlign: 'center' } }), email = h('input', { class: 'field', type: 'email', placeholder: 'Email', autocomplete: 'email' }), pw = h('input', { class: 'field', type: 'password', placeholder: 'Password (6+ characters)', autocomplete: 'current-password' });
      const run = async (fn) => { msg.textContent = ''; try{ await fn(); Kit.toast('Signed in', 'good'); A.pop(); }catch(e){ msg.textContent = (e && e.code === 'auth/popup-closed-by-user') ? '' : (e.message || 'Sign-in failed').replace('Firebase: ', ''); } };
      b.append(h('p', { class: 'sub' }, 'Signing in saves your cash, items, shares and properties to your account. If it’s your first time, your current guest session becomes your account.'),
        h('button', { class: 'btn block', style: { background: '#fff', color: '#222', marginBottom: '14px' }, html: '<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.4-5.7c-2.1 1.4-4.8 2.3-8.1 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span>Continue with Google</span>', onclick: () => run(() => OS.auth.google()) }),
        h('div', { class: 'cap', style: { textAlign: 'center' } }, 'or use email'), h('div', { class: 'stack' }, email, pw),
        h('div', { class: 'hstack', style: { marginTop: '14px' } }, h('button', { class: 'btn grow', onclick: () => run(() => OS.auth.email(email.value.trim(), pw.value, false)) }, 'Sign in'), h('button', { class: 'btn gray grow', onclick: () => run(() => OS.auth.email(email.value.trim(), pw.value, true)) }, 'Create account')),
        h('div', { style: { textAlign: 'center', marginTop: '8px' } }, h('button', { class: 'btn plain sm', onclick: async () => { if(!email.value) return (msg.textContent = 'Enter your email first.'); try{ await OS.auth.reset(email.value.trim()); Kit.toast('Reset email sent'); }catch(e){ msg.textContent = e.message; } } }, 'Forgot password?')), msg);
    } });
  }
  function openAccount(){
    A.push({ title: 'Account', backLabel: 'Settings', build: (b) => {
      const u = OS.auth.user(), msg = h('div', { class: 'foot', style: { color: 'var(--bad)' } }), name = h('input', { class: 'field', value: OS.auth.name() || '', placeholder: 'Display name', maxlength: 20 });
      b.append(h('div', { class: 'cap' }, 'Display name'), h('div', { class: 'hstack' }, name, h('button', { class: 'btn', onclick: async () => { try{ await OS.auth.setName(name.value); msg.style.color = 'var(--good)'; msg.textContent = 'Saved. You’ll appear on the wealth ranking.'; paintAcct(); }catch(e){ msg.style.color = 'var(--bad)'; msg.textContent = e.message; } } }, 'Save')), msg,
        h('div', { class: 'cap' }, 'Sync'), group(row({ title: 'Email', right: u.email }), row({ title: 'Status', right: OS.auth.sync().loaded ? 'Saved to the cloud' : 'Loading…' })),
        h('div', { style: { marginTop: '22px' } }, h('button', { class: 'btn block bad', onclick: async () => { if(await Kit.confirm({ title: 'Sign out?', msg: 'Your progress stays in your account. This device will return to a fresh guest session.', ok: 'Sign out', destructive: true })){ await OS.auth.signOut(); A.popToRoot(); Kit.toast('Signed out'); } } }, 'Sign out')));
    } });
  }

  /* ---------- everything else ---------- */
  function paintRest(){
    rest.innerHTML = '';
    // Appearance
    rest.appendChild(h('div', { class: 'cap' }, 'Appearance'));
    const themeSeg = seg([{ id: 'auto', label: 'Auto' }, { id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }], P_.get('theme'), v => P_.set('theme', v));
    rest.appendChild(group(h('div', { class: 'row' }, h('div', { class: 'tx' }, h('b', null, 'Theme'), h('small', null, 'Auto follows your device')), h('div', { style: { width: '190px' } }, themeSeg)),
      row({ glyph: 'image', color: '#c0563a', title: 'Wallpapers', sub: 'Pick a photo for light and dark mode', chev: true, onClick: openWallpapers })));
    rest.appendChild(h('div', { class: 'cap' }, 'Display'));
    rest.appendChild(group(
      row({ title: 'Show lock screen on start', sub: 'A clock screen you click to enter', right: toggle(P_.get('lock') === true, v => P_.set('lock', v)) }), row({ title: 'Notification banners', right: toggle(P_.get('banners') !== false, v => P_.set('banners', v)) }),
      row({ title: 'Reduce motion', sub: 'Skips zoom and slide animations', right: toggle(!!P_.get('reduceMotion'), v => P_.set('reduceMotion', v)) }), row({ title: 'Reduce transparency', sub: 'Turns off blur — faster on older devices', right: toggle(!!P_.get('reduceTransparency'), v => P_.set('reduceTransparency', v)) })));
    // Desktop
    rest.appendChild(h('div', { class: 'cap' }, 'Desktop'));
    rest.appendChild(group(row({ glyph: 'grid', color: '#4a6fa8', title: 'Dock apps', sub: OS.prefs.get('dock').length ? OS.prefs.get('dock').join(', ') : 'All apps', chev: true, onClick: openDock }),
      row({ glyph: 'refresh', color: '#7b7468', title: 'Reset layout', sub: 'Restore the default widgets and window sizes', onClick: async () => { if(await Kit.confirm({ title: 'Reset the desktop?', ok: 'Reset', destructive: true })){ OS.shell.resetLayout(); Kit.toast('Desktop reset'); } } })));
    rest.appendChild(group(
      h('div', { class: 'row' }, h('div', { class: 'tx' }, h('b', null, 'Icon size'), h('small', null, 'App icons on the desktop')), h('div', { style: { width: '210px' } }, seg([{ id: 'small', label: 'Small' }, { id: 'medium', label: 'Medium' }, { id: 'large', label: 'Large' }], P_.get('iconSize') || 'medium', v => P_.set('iconSize', v)))),
      row({ title: '24-hour clock', sub: 'Used by the Clock widget', right: toggle(!!P_.get('clock24'), v => P_.set('clock24', v)) }),
      row({ title: 'Show seconds on the clock', right: toggle(!!P_.get('clockSeconds'), v => P_.set('clockSeconds', v)) })));
    rest.appendChild(h('div', { class: 'cap' }, 'Performance'));
    rest.appendChild(group(h('div', { class: 'row' }, h('div', { class: 'tx' }, h('b', null, 'Live update speed'), h('small', { class: 'wrap' }, 'How often prices and widgets refresh. Saver is lighter on batteries and older computers.')), h('div', { style: { width: '230px' } }, seg([{ id: 'saver', label: 'Saver' }, { id: 'balanced', label: 'Balanced' }, { id: 'smooth', label: 'Smooth' }], P_.get('updateSpeed') || 'balanced', v => P_.set('updateSpeed', v))))));
    rest.appendChild(h('div', { class: 'cap' }, 'News'));
    rest.appendChild(group(row({ glyph: 'news', color: '#a2321f', title: 'Open the Wanted poster', sub: 'Shows it in the Preview app', chev: true, onClick: () => OS.preview({ kind: 'poster' }) })));
    rest.appendChild(h('div', { class: 'foot' }, 'Tip: click “Edit desktop” (top left) to add widgets, resize them and drag them around. Drag a window by its title bar; the green button maximizes.'));
    // Data
    rest.appendChild(h('div', { class: 'cap' }, 'Data & storage'));
    const u = OS.usage(), kb = n => n > 1e6 ? (n / 1e6).toFixed(2) + ' MB' : Math.max(0, Math.round(n / 1e3)) + ' KB';
    rest.appendChild(group(row({ title: 'Downloaded this session', right: kb(u.bytes) }), row({ title: 'Database reads / saves', right: u.reads + ' / ' + u.writes }), row({ glyph: 'trash', color: '#7b7468', title: 'Clear saved photos', sub: 'Frees the space photos use on this device', onClick: async () => { const n = await OS.gallery.cacheSize(); if(await Kit.confirm({ title: 'Clear saved photos?', msg: (n / 1e6).toFixed(1) + ' MB will be removed. Photos download again when you next open them.', ok: 'Clear', destructive: true })){ await OS.gallery.clearCache(); Kit.toast('Cleared', 'good'); } } }), row({ title: 'Saving', sub: OS.auth.signedIn() ? 'Changes are batched and saved every ~20 seconds.' : 'Off — sign in to save progress.', wrap: true })));
    rest.appendChild(h('div', { class: 'foot' }, 'WestOS is built to stay inside Firebase’s free limits: prices are computed on your device, photos are cached after the first view, and only changed data is saved.'));
    // About
    rest.appendChild(h('div', { class: 'cap' }, 'About'));
    rest.appendChild(group(row({ title: 'WestOS', right: 'Version ' + OS.version })));
    if(OS.auth.isAdmin()) rest.appendChild(h('div', null, h('div', { class: 'cap' }, 'Administrator'), group(row({ glyph: 'bolt', color: '#c23b3b', title: 'Admin tools', sub: 'Market, messages, photos, players', chev: true, onClick: openAdmin }), row({ title: 'Administrator account', sub: 'Only this verified account has admin rights. To change it, edit os/config.js and database.rules.json.', wrap: true, right: OS.cfg.adminEmail }))));
  }
  function wallPicker(mode){
    A.push({ title: mode === 'dark' ? 'Dark wallpaper' : 'Light wallpaper', backLabel: 'Wallpapers', build: async (b) => {
      b.appendChild(h('div', { class: 'spin', style: { margin: '40px auto' } })); let list = []; try{ list = (await OS.gallery.list()).filter(m => m.type !== 'video'); }catch(e){} b.innerHTML = '';
      const cur = P_.get('wall')[mode]; const grid = h('div', { class: 'wp-grid' }); b.append(h('p', { class: 'sub' }, 'Photos come from the Photos app. The first time you pick one it downloads once, then it’s stored on this device.'), grid);
      const cell = (id, label, thumb) => { const c = h('button', { class: 'wp-cell' + (cur === id || (!cur && !id) ? ' on' : ''), style: thumb ? { backgroundImage: 'url("' + thumb + '")' } : { background: mode === 'dark' ? 'linear-gradient(160deg,#6b3a1d,#1b110a)' : 'linear-gradient(160deg,#f6d9a0,#dcc79d)' }, onclick: () => { P_.set('wall', Object.assign({}, P_.get('wall'), { [mode]: id })); $$('.wp-cell', grid).forEach(x => x.classList.remove('on')); c.classList.add('on'); Kit.toast(id ? 'Wallpaper set' : 'Default wallpaper'); } }, h('span', null, label || ''), h('i', { class: 'ck', html: Kit.icon('check', 14, 3) })); grid.appendChild(c); return c; };
      cell(null, 'Default'); list.forEach(m => { const c = cell(m.id, m.title ? m.title.slice(0, 14) : ''); c.style.backgroundColor = 'var(--card2)'; OS.gallery.thumb(m).then(t => { if(t) c.style.backgroundImage = 'url("' + t + '")'; }); });
      if(!list.length) b.appendChild(h('div', { class: 'empty' }, 'No photos yet. Photos added in the Photos app will show up here.'));
    } });
  }
  const $$ = Kit.$$;
  function openWallpapers(){
    A.push({ title: 'Wallpapers', backLabel: 'Settings', build: (b) => {
      const w = P_.get('wall'), mk = (mode) => { const d = h('div', { style: { background: mode === 'dark' ? 'linear-gradient(160deg,#6b3a1d,#1b110a)' : 'linear-gradient(160deg,#f6d9a0,#dcc79d)' } }, h('small', null, mode === 'dark' ? 'Dark' : 'Light')); if(w[mode]) OS.gallery.wallpaper(w[mode]).then(u => { if(u) d.style.backgroundImage = 'url("' + u + '")'; d.style.backgroundSize = 'cover'; }); return d; };
      b.append(h('div', { class: 'wp-prev' }, mk('light'), mk('dark')), group(row({ glyph: 'sun', color: '#e0a23a', title: 'Light mode wallpaper', chev: true, onClick: () => wallPicker('light') }), row({ glyph: 'moon', color: '#5b58b8', title: 'Dark mode wallpaper', chev: true, onClick: () => wallPicker('dark') })));
    } });
  }
  function openDock(){
    A.push({ title: 'Dock apps', backLabel: 'Settings', build: (b) => {
      const apps = OS.apps(), sel = new Set(P_.get('dock').length ? P_.get('dock') : apps.map(a => a.id)); const list = h('div');
      const draw = () => { list.innerHTML = ''; list.appendChild(group(apps.map(a => row({ left: h('span', { html: Kit.tile(a.id, 34).replace('class="tile"', 'class="tile" style="border-radius:8px"') || '' }), title: a.name, right: h('span', { style: { color: 'var(--tint)', opacity: sel.has(a.id) ? 1 : 0 }, html: Kit.icon('check', 20, 3) }), onClick: () => { if(sel.has(a.id)){ if(sel.size <= 2) return Kit.toast('Keep at least two apps'); sel.delete(a.id); } else sel.add(a.id); P_.set('dock', apps.map(x => x.id).filter(id => sel.has(id))); draw(); } })))); };
      b.append(h('p', { class: 'sub' }, 'Choose which apps live in the dock. Apps you remove can be added back as desktop shortcuts.'), list); draw();
    } });
  }
  function openAdmin(){
    A.push({ title: 'Admin tools', backLabel: 'Settings', build: (b) => {
      // market
      const lvl = h('select', { class: 'field' }, ...OS.admin.volLevels().map(l => h('option', { value: l }, l[0].toUpperCase() + l.slice(1)))); lvl.value = OS.admin.volatility();
      const cur = h('b', null, OS.admin.volatility()), msg = h('div', { class: 'foot' });
      const delta = h('input', { class: 'field', type: 'number', placeholder: 'Price shove (e.g. 25 or −25)', step: 'any' }), fade = h('input', { class: 'field', type: 'number', placeholder: 'Fade seconds (optional)' });
      const say = (m, ok) => { msg.style.color = ok ? 'var(--good)' : 'var(--bad)'; msg.textContent = m; };
      b.append(h('div', { class: 'cap' }, 'Market volatility (everyone)'), h('p', { class: 'sub' }, 'Only you can see or change this. It applies to every player at the same moment and never re-prices old history.'),
        h('div', { class: 'hstack' }, lvl, h('button', { class: 'btn', onclick: async () => { try{ await OS.admin.setVolatility(lvl.value); say('Volatility set to ' + lvl.value + '.', true); }catch(e){ say(e.message); } } }, 'Apply')), msg,
        h('div', { class: 'cap' }, 'Price shove'), h('div', { class: 'stack' }, delta, fade, h('button', { class: 'btn gray', onclick: async () => { const d = parseFloat(delta.value); if(!isFinite(d) || d === 0) return say('Enter a non-zero number.'); try{ await OS.admin.adjustPrice(d, parseFloat(fade.value) || 0); say('Applied ' + (d > 0 ? '+' : '') + d + '.', true); }catch(e){ say(e.message); } } }, 'Apply price shove')));
      // broadcast
      const bs = h('input', { class: 'field', placeholder: 'Subject' }), bb = h('textarea', { class: 'field', placeholder: 'Message to all players' });
      b.append(h('div', { class: 'cap' }, 'Broadcast message'), h('div', { class: 'stack' }, bs, bb, h('button', { class: 'btn', onclick: async () => { if(!bs.value.trim()) return Kit.toast('Add a subject'); try{ await OS.admin.broadcast(bs.value, bb.value); bs.value = bb.value = ''; Kit.toast('Broadcast sent', 'good'); }catch(e){ Kit.toast(e.message, 'bad'); } } }, 'Send to everyone')));
      b.append(h('div', { class: 'cap' }, 'More'), group(row({ glyph: 'files', color: '#2d6bb8', title: 'Players & server data', sub: 'Open the Files app', chev: true, onClick: () => OS.open('Files') }), row({ glyph: 'photos', color: '#c23b6b', title: 'Photo archive', sub: 'Upload and manage in Photos', chev: true, onClick: () => OS.open('Photos') })));
    } });
  }
  paintAcct(); paintRest(); Kit.live('auth', () => { paintAcct(); paintRest(); }); Kit.live('prefs', Kit.debounce(() => {}, 100));
} });
</script></body></html>
