<style>

    /* ---------- result panel ---------- */

      if(c.note) card.appendChild(h('div', { class: 'sub' }, c.note));
      const lnK10 = c.lnK / Math.LN10, kt = Math.abs(lnK10) > 99 ? (lnK10 > 0 ? '≫ 1' : '≪ 1') : '10^' + lnK10.toFixed(1);
      card.appendChild(h('div', { class: 'kg', html: '<div><small>ΔG at ' + c.T + ' K</small><b class="' + (c.dG <= 0 ? 'good' : 'bad') + '">' + fmtE(c.dG) + '</b></div><div><small>Equilibrium constant K</small><b>' + kt + '</b></div><div><small>Activation energy</small><b>' + Math.round(c.Ea) + ' kJ/mol</b></div><div><small>Reaction time (95 %)</small><b>' + esc(s.tLabel) + '</b></div><div><small>% yield</small><b class="' + (s.y > .95 ? 'good' : s.y > .3 ? 'warn' : 'bad') + '">' + (s.y * 100).toFixed(s.y > .9995 ? 0 : 1) + ' %</b></div><div><small>Limiting reagent</small><b>' + pf(s.limiting || '—') + '</b></div><div><small>' + (s.heat >= 0 ? 'Heat released' : 'Heat absorbed') + '</small><b class="' + (s.heat >= 0 ? 'warn' : '') + '">' + fmtE(Math.abs(s.heat)) + '</b></div><div><small>Peak temperature</small><b>' + Math.round(s.Tpeak) + ' K</b></div>' + (s.pH != null ? '<div><small>pH afterwards (1 L)</small><b>' + s.pH + '</b></div>' : '') + (s.sealed ? '<div><small>Peak pressure</small><b>' + (s.Pfinal < 10 ? s.Pfinal.toFixed(1) : Math.round(s.Pfinal)) + ' bar</b></div>' : '') }));
      if(s.hazard) card.appendChild(h('div', { class: 'warnbox bad' }, s.hazard === 'burst' ? '💥 Peak pressure would exceed your vessel. A run would rupture it and half the product would be lost. Use less, or get a High-Pressure Reactor.' : (s.violent ? '🔥 Alkali metals react violently with water — hydrogen can ignite. Your glassware may fail.' : '🔥 This releases enough heat to reach ≈ ' + Math.round(s.Tpeak) + ' K — beyond what your vessel survives. A run would crack it and half the product would be lost.')));
      (s.notes || []).forEach(n => card.appendChild(h('div', { class: 'sub', style: { margin: '6px 0' } }, n)));
      card.append(h('div', { class: 'cap' }, 'Energy (per reaction)'), h('div', { html: bars(c) }), h('div', { class: 'cap' }, 'Amounts over time'), h('div', { html: chart(c, s) }));
      const pr = h('div', { class: 'prods' }); c.Pr.forEach(p => { const have = (p[0] === 'x'), made = Math.floor(p[1] * s.xi + 1e-9); pr.appendChild(h('div', { class: 'prod' }, h('div', { class: 'f', html: pf(p[3]) }), h('div', { class: 'grow' }, h('b', null, p[4] === 'element' ? CH.elements[p[0]].name : CH.nameOf(p[0])), h('small', null, p[4] === 'element' ? 'Element' : (L.found().includes(p[0]) ? 'Known compound' : '✨ New discovery!'))), h('span', { class: 'sub num' }, '≈ ' + made + ' mol'))); }); card.appendChild(pr);
      card.append(h('button', { class: 'btn block', style: { marginTop: '12px' }, disabled: s.xi <= 0, onclick: () => run(c, s) }, s.hazard ? 'Run anyway (risky)' : 'Run reaction'), h('div', { class: 'foot' }, 'Equations are balanced exactly; ΔG = ΔH − TΔS from tabulated data; the yield is the true equilibrium for your amounts, T and P.'));
    }
    async function refresh(){
      const my = ++seq, keys = synth ? [] : reagents; controls(); chips();
      if(synth){ tgtInfo.innerHTML = ''; if(target){ const v = L.validate(target); if(!v.ok){ cur = { card: { ok: false, why: v.reason } }; tgtInfo.appendChild(h('div', { class: 'sub', style: { marginTop: '10px', color: 'var(--bad)' } }, v.reason)); return sim(); } const d = L.describe(v.formula || target); tgtInfo.appendChild(h('div', { class: 'hstack', style: { marginTop: '10px' } }, h('div', { class: 'mono', style: { fontSize: '24px', color: 'var(--tint)' }, html: pf(v.formula || target) }), h('div', null, h('b', null, d ? d.name : target), h('div', { class: 'sub' }, d ? d.category + (d.mass ? ' · ' + d.mass.toFixed(2) + ' g/mol' : '') : '')))); } }
      if(!keys.length && !(synth && target)){ cur = null; return sim(); }
      const p = await L.plan({ keys, target: synth ? target : '', T, P, cat, elec }); if(my !== seq) return; cur = p;
      if(p.card && p.card.ok){ p.card.R.forEach(x => { const have = Math.max(1, molesOf(x[0])); if(!(amounts[x[0]] >= 1)) amounts[x[0]] = Math.min(have, x[1]); amounts[x[0]] = Math.min(amounts[x[0]], have); }); }
      sim();
    }
    async function run(c, s){
      if(busy) return; let risk = false;
      if(s.hazard){ if(!await Kit.confirm({ title: 'Unsafe run', msg: 'Your vessel will fail: half the product is lost and cleanup costs $25. Run anyway?', ok: 'Run anyway' })) return; risk = true; }
      busy = true; const bk0 = main.querySelector('.beaker'); bk0 && bk0.classList.add('go');
      const res = L.run({ keys: synth ? [] : reagents, target: synth ? target : '', T, P, cat, elec }, amounts, { removal, risk }); const [r] = await Promise.all([res, new Promise(ok => setTimeout(ok, 1600))]);
      bk0 && (bk0.classList.remove('go'), bk0.classList.add('pop')); busy = false;
      if(!r.ok){ Kit.toast(r.msg, 'bad'); return refresh(); }
      reagents = reagents.filter(k => molesOf(k) > 0); Object.keys(amounts).forEach(k => { if(molesOf(k) < 1) delete amounts[k]; else amounts[k] = Math.min(amounts[k], molesOf(k)); }); result(r); refresh();
    }
    function result(r){
      Kit.sheet({ title: r.hazard ? 'Vessel failed' : 'Reaction complete', build: (sb) => {
        sb.appendChild(h('div', { html: '<svg class="win-anim" viewBox="0 0 84 84" fill="none" stroke="' + (r.hazard ? 'var(--warn)' : 'var(--good)') + '" stroke-width="5" stroke-linecap="round"><circle cx="42" cy="42" r="37"/><path d="' + (r.hazard ? 'M42 24v22M42 58v1' : 'M26 43l11 11 21-23') + '"/></svg>' }));
        sb.appendChild(h('div', { class: 'eq', style: { textAlign: 'center' }, html: esc(r.equation) }));
        sb.appendChild(h('div', { class: 'chips', style: { justifyContent: 'center' } }, h('span', { class: 'tag good' }, (r.y * 100).toFixed(r.y > .9995 ? 0 : 1) + ' % yield'), h('span', { class: 'tag' }, 'took ' + r.tLabel), h('span', { class: 'tag ' + (r.src === 'github' ? 'good' : 'tint') }, r.src === 'github' ? 'from GitHub library' : 'calculated here')));
        sb.appendChild(r.made.length ? group(r.made.map(m => row({ title: m.name, sub: pf(m.key), right: h('b', { class: 'up num' }, '+' + Kit.num(m.n)) }))) : h('div', { class: 'sub', style: { textAlign: 'center' } }, 'Nothing could be recovered.'));
        if(r.newly.length) sb.appendChild(h('div', { class: 'card', style: { marginTop: '12px', background: 'var(--tint-dim)' } }, h('b', { style: { color: 'var(--tint)' } }, '✨ New discovery' + (r.newly.length > 1 ? 'ies' : '') + ': ' + r.newly.map(n => n.name).join(', ')), h('div', { class: 'sub' }, 'Bonus ' + money(r.bonus, { dp: 2 }) + (r.firstGlobal ? ' — and you’re the first player in the world to make it!' : ''))));
        sb.appendChild(h('div', { class: 'foot', style: { textAlign: 'center' } }, 'Lab fee paid: ' + money(r.fee, { dp: 2 })));
        sb.appendChild(h('div', { class: 'hstack', style: { marginTop: '14px' } }, h('button', { class: 'btn gray grow', onclick: () => OS.open('WestShop') }, 'Sell in WestShop'), h('button', { class: 'btn grow', onclick: e => e.target.closest('.ksheet').querySelector('.nbtn').click() }, 'Done')));
      } });
    }
    main._paint = () => { chips(); if(!busy) refresh(); }; refresh();
  }

  /* ---------- Equipment ---------- */
  function equipTab(root){
    root.appendChild(h('p', { class: 'sub', style: { marginTop: 0 } }, 'Equipment doesn’t unlock a recipe — it changes the physics you can reach: how hot, how squeezed, how fast, and what energy you can feed in.'));
    root.appendChild(group(L.tools().map(t => row({ glyph: 'lab', color: t.owned ? '#4e9a63' : '#7b7468', title: t.name, sub: TOOLTXT[t.id] || t.desc, wrap: true, right: t.owned ? h('span', { class: 'tag good' }, 'Owned') : h('button', { class: 'btn sm', onclick: async e => { e.stopPropagation(); if(await Kit.confirm({ title: 'Buy ' + t.name + '?', msg: money(t.cost) + ' — one-time purchase.', ok: 'Buy' })){ const r = L.buyTool(t.id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); draw(); } } }, money(t.cost)) }))));
  }
  /* ---------- Library: discoveries + the shared reaction library ---------- */
  function foundTab(root){
    const f = L.found(), total = CH.registryList().length, ci = L.cacheInfo();
    root.append(h('div', { class: 'kpis' }, h('div', { class: 'kpi' }, h('small', null, 'Compounds discovered'), h('b', null, f.length + ' / ' + total)), h('div', { class: 'kpi' }, h('small', null, 'Reactions run'), h('b', null, Kit.num(L.runs()))), h('div', { class: 'kpi' }, h('small', null, 'Library lookups this session'), h('b', null, ci.github + ' hit · ' + ci.local + ' new'))),
      h('div', { class: 'bar-prog', style: { margin: '14px 0' } }, h('i', { style: { width: Math.min(100, f.length / total * 100) + '%' } })), h('p', { class: 'foot' }, 'Every reaction you calculate is checked against the shared GitHub library first. New valid reactions are re-verified by a server-side run of the same engine and added for everyone.'));
    if(f.length){ root.appendChild(h('h2', { class: 'sec' }, 'Your discoveries')); root.appendChild(group(f.slice().reverse().map(k => row({ left: h('div', { class: 'mono', style: { width: '74px', color: 'var(--tint)', fontSize: '15px' }, html: pf(k) }), title: CH.nameOf(k) })))); }
    else root.appendChild(h('div', { class: 'empty', html: Kit.icon('flask', 56, 1.4) + 'No discoveries yet.<br>Run a reaction that makes a compound you haven’t made before.' }));
    const g = h('div'); root.appendChild(g);
    L.registry().then(reg => { const arr = Object.keys(reg || {}).map(k => Object.assign({ id: k }, reg[k])).filter(x => x.by).sort((a, b) => (b.t || 0) - (a.t || 0)).slice(0, 12); if(!arr.length) return; g.appendChild(h('h2', { class: 'sec' }, 'Worldwide firsts')); g.appendChild(group(arr.map(x => row({ title: x.eq ? x.eq.replace(/→.*/, '→ …') : x.id, sub: 'First made by ' + x.by, right: x.t ? Kit.ago(x.t) : '' })))); });
  }
  draw(); ['inv', 'lab'].forEach(e => Kit.live(e, Kit.debounce(() => { if(!busy && main._paint && (tab === 'reactor' || tab === 'synth')) main._paint(); }, 150)));
} });
</script></body></html>
