    /* --- the canvas: molecules, bonds breaking and forming --- */
    function size(){ const r = devicePixelRatio || 1, w = stage.clientWidth || 600, hh = stage.clientHeight || 280; if(cv.width !== Math.round(w * r)){ cv.width = Math.round(w * r); cv.height = Math.round(hh * r); } return [w, hh, r]; }
    function buildScene(){
      const c = cur && cur.card, [W, Hh] = size(); let card = c && c.ok ? c : null;
      if(!card && !reagents.length){ scn = null; return; }
      const fake = !card; if(fake) card = { R: reagents.map(k => [k, 1]), Pr: reagents.map(k => [k, 1]) };
      try{ scn = MOL.scene(card, k => L.graph(k), W, Hh); }catch(e){ scn = null; } if(scn && fake) scn.noGhost = true;
      Promise.all(card.R.concat(card.Pr).map(x => L.identify(x[0]))).then(() => { const my = seq; setTimeout(() => { if(my === seq && !busy && cv.isConnected){ const [W2, H2] = size(); try{ const s2 = MOL.scene(card, k => L.graph(k), W2, H2); if(s2){ s2.noGhost = fake; scn = s2; } }catch(e){} } }, 0); });
    }
    function frame(ts){
      raf = requestAnimationFrame(frame); if(!cv.isConnected){ cancelAnimationFrame(raf); return; }
      const [W, Hh, r] = size(), c = cv.getContext('2d'); c.setTransform(r, 0, 0, r, 0, 0); c.clearRect(0, 0, W, Hh); if(!scn) return;
      if(anim.mode === 'play'){ anim.u = Math.min(1, (ts - anim.t0) / 2800); if(anim.u >= 1) anim.mode = 'done'; } const u = anim.mode === 'idle' ? 0 : anim.u;
      try{ drawScene(c, W, Hh, scn, u, ts, T, anim.mode); }catch(e){}
    }

    /* --- result panels --- */
    function bars(c){ const ds = [['ΔH', c.dH], ['−TΔS', -c.T * c.dS / 1000], ['ΔG', c.dG]], m = Math.max(1, ...ds.map(d => Math.abs(d[1]))); return '<svg class="plot" viewBox="0 0 300 96"><line class="ax" x1="150" x2="150" y1="4" y2="92"/>' + ds.map((d, i) => { const w = Math.abs(d[1]) / m * 128, x = d[1] >= 0 ? 150 : 150 - w, col = d[0] === 'ΔG' ? (d[1] <= 0 ? 'var(--good)' : 'var(--bad)') : (d[1] <= 0 ? 'var(--blue)' : 'var(--warn)'); return '<rect x="' + x + '" y="' + (8 + i * 28) + '" width="' + Math.max(1, w) + '" height="18" rx="5" fill="' + col + '"/><text x="' + (d[1] >= 0 ? 154 + w : 146 - w) + '" y="' + (21 + i * 28) + '" text-anchor="' + (d[1] >= 0 ? 'start' : 'end') + '">' + d[0] + '  ' + fmtE(d[1]) + '</text>'; }).join('') + '</svg>'; }
    function chart(c, s){ const W = 320, Hh = 150, X0 = 34, X1 = W - 8, Y0 = 10, Y1 = Hh - 24, sp = c.R.map(x => ({ f: x[3], key: x[0], nu: -x[1], n0: +amounts[x[0]] || 0 })).concat(c.Pr.map(x => ({ f: x[3], key: x[0], nu: x[1], n0: 0 }))), N = s.curve.length - 1, top = Math.max(1e-9, ...sp.map(q => Math.max(q.n0, q.n0 + q.nu * s.xi))), ys = v => Y1 - (v / top) * (Y1 - Y0);
      return '<svg class="plot" viewBox="0 0 ' + W + ' ' + Hh + '"><line class="ax" x1="' + X0 + '" x2="' + X0 + '" y1="' + Y0 + '" y2="' + Y1 + '"/><line class="ax" x1="' + X0 + '" x2="' + X1 + '" y1="' + Y1 + '" y2="' + Y1 + '"/>' + sp.map(q => '<path class="ln" stroke="' + colorOfKey(q.key) + '" d="' + s.curve.map((v, i) => (i ? 'L' : 'M') + (X0 + (X1 - X0) * i / N).toFixed(1) + ' ' + ys(Math.max(0, q.n0 + q.nu * s.xi * v)).toFixed(1)).join(' ') + '"/>').join('') + '<text x="' + X0 + '" y="' + (Hh - 8) + '">0</text><text x="' + X1 + '" y="' + (Hh - 8) + '" text-anchor="end">' + (s.tLabel === 'electrolysis' ? '1 h' : fmtT(s.t95 * 1.6)) + '</text><text x="' + (X0 - 4) + '" y="' + (Y0 + 8) + '" text-anchor="end">' + Kit.num(+top.toFixed(2)) + '</text><text x="' + (X0 - 4) + '" y="' + Y1 + '" text-anchor="end">mol</text></svg><div class="leg">' + sp.map(q => '<span><i style="background:' + colorOfKey(q.key) + '"></i>' + pf(q.f) + '</span>').join('') + '</div>'; }
    function sim(){
      lists(); resBox.innerHTML = ''; predBox.innerHTML = ''; const c = cur && cur.card;
      if(!c || !c.ok){ const m = !reagents.length ? 'Add reagents to see what happens.' : (c ? c.why : 'Working it out…'); predBox.appendChild(h('div', { class: 'sub' }, reagents.length ? 'Nothing forms under these conditions.' : 'Waiting for reagents.'));
        if(reagents.length) resBox.appendChild(h('div', { class: 'card' }, c && !c.ok ? h('b', { style: { color: 'var(--bad)' } }, 'It won’t go like this') : null, h('div', { class: 'sub', style: { marginTop: '6px', lineHeight: 1.45 } }, m), c && !c.ok ? h('div', { class: 'foot' }, 'Change the temperature, pressure, equipment or reagents — everything updates live.') : null));
        else resBox.appendChild(h('div', { class: 'card' }, h('div', { class: 'sub' }, 'Real chemistry: some combinations need heat, pressure, a catalyst or different amounts before they go. Try Na + Cl, HCl + NaOH, AgNO₃ + NaCl, Zn + HCl, or N + H (hot, squeezed, catalysed).'))); return; }

      const card = h('div', { class: 'card' }); resBox.appendChild(card);
      card.append(h('div', { class: 'chips' }, h('span', { class: 'tag tint' }, c.type), h('span', { class: 'tag ' + srcTag[0] }, srcTag[1]), h('span', { class: 'tag ' + (c.est ? 'warn' : 'good') }, c.est ? 'Estimated data ±' + c.err + ' kJ' : 'Tabulated data'), c.elec ? h('span', { class: 'tag' }, '⚡ ' + c.E + ' V') : null), h('div', { class: 'eq', html: c.eq.replace(/(^|\+ |→ )(\d+) /g, '$1<span style="color:var(--tint)">$2</span> ') }));

      const l10 = c.lnK / Math.LN10, kt = Math.abs(l10) > 99 ? (l10 > 0 ? '≫ 1' : '≪ 1') : '10^' + l10.toFixed(1);
      card.appendChild(h('div', { class: 'kg', html: '<div><small>ΔG at ' + c.T + ' K</small><b class="' + (c.dG <= 0 ? 'good' : 'bad') + '">' + fmtE(c.dG) + '</b></div><div><small>Equilibrium constant K</small><b>' + kt + '</b></div><div><small>Activation energy</small><b>' + Math.round(c.Ea) + ' kJ/mol</b></div><div><small>Reaction time (95 %)</small><b>' + esc(s.tLabel) + '</b></div><div><small>% yield</small><b class="' + (s.y > .95 ? 'good' : s.y > .3 ? 'warn' : 'bad') + '">' + (s.y * 100).toFixed(s.y > .9995 ? 0 : 1) + ' %</b></div><div><small>Limiting reagent</small><b>' + pf(s.limiting || '—') + '</b></div><div><small>' + (s.heat >= 0 ? 'Heat released' : 'Heat absorbed') + '</small><b class="' + (s.heat >= 0 ? 'warn' : '') + '">' + fmtE(Math.abs(s.heat)) + '</b></div><div><small>Peak temperature</small><b>' + Math.round(s.Tpeak) + ' K</b></div>' + (s.pH != null ? '<div><small>pH afterwards (1 L)</small><b>' + s.pH + '</b></div>' : '') + (s.sealed ? '<div><small>Peak pressure</small><b>' + (s.Pfinal < 10 ? s.Pfinal.toFixed(1) : Math.round(s.Pfinal)) + ' bar</b></div>' : '') }));

      card.append(h('button', { class: 'btn block', style: { marginTop: '8px' }, disabled: s.xi <= 0 || busy, onclick: () => run(c, s) }, s.hazard ? 'Run anyway (risky)' : 'Run reaction'));
      const det = h('details', { style: { marginTop: '12px' } }, h('summary', { class: 'sub', style: { cursor: 'pointer' } }, 'Energy & kinetics'), h('div', { class: 'cap' }, 'Energy (per reaction)'), h('div', { html: bars(c) }), h('div', { class: 'cap' }, 'Amounts over time'), h('div', { html: chart(c, s) }), h('div', { class: 'foot' }, 'ΔG = ΔH − TΔS from tabulated data; the yield is the true equilibrium for your amounts, T and P; the bond animation uses average bond energies, so its net is only approximate.')); card.appendChild(det);
    }
    async function refresh(){
      const my = ++seq; controls(); lists(); anim = { mode: 'idle', u: 0, t0: 0 };

      const p = await L.plan({ keys: reagents, T, P, cat, elec }); if(my !== seq) return; cur = p;
      if(p.card && p.card.ok) p.card.R.forEach(x => { const have = Math.max(1, avail(x[0])); if(!(amounts[x[0]] >= 1)) amounts[x[0]] = Math.min(have, x[1]); amounts[x[0]] = Math.min(amounts[x[0]], have); });

    async function refreshKeep(){ const my = ++seq; controls(); if(!reagents.length){ scn = null; anim = { mode: 'idle', u: 0, t0: 0 }; return sim(); } const p = await L.plan({ keys: reagents, T, P, cat, elec }); if(my !== seq) return; cur = p; buildScene(); anim = { mode: 'idle', u: 0, t0: 0 }; sim(); }
    function result(r){
      Kit.sheet({ title: r.hazard ? 'Vessel failed' : 'Reaction complete', build: (sb) => {
        sb.appendChild(h('div', { html: '<svg class="win-anim" viewBox="0 0 84 84" fill="none" stroke="' + (r.hazard ? 'var(--warn)' : 'var(--good)') + '" stroke-width="5" stroke-linecap="round"><circle cx="42" cy="42" r="37"/><path d="' + (r.hazard ? 'M42 24v22M42 58v1' : 'M26 43l11 11 21-23') + '"/></svg>' }), h('div', { class: 'eq', style: { textAlign: 'center' }, html: esc(r.equation) }), h('div', { class: 'chips', style: { justifyContent: 'center' } }, h('span', { class: 'tag good' }, (r.y * 100).toFixed(r.y > .9995 ? 0 : 1) + ' % yield'), h('span', { class: 'tag' }, 'took ' + r.tLabel), h('span', { class: 'tag ' + (r.src === 'github' ? 'good' : 'tint') }, r.src === 'github' ? 'from GitHub library' : 'calculated here')));

        if(r.newly.length) sb.appendChild(h('div', { class: 'card', style: { marginTop: '12px', background: 'var(--tint-dim)' } }, h('b', { style: { color: 'var(--tint)' } }, '✨ New discovery: ' + r.newly.map(n => n.name).join(', ')), h('div', { class: 'sub' }, 'Bonus ' + money(r.bonus, { dp: 2 }) + (r.firstGlobal ? ' — and you’re the first player in the world to make it!' : ''))));
        sb.appendChild(h('div', { class: 'foot', style: { textAlign: 'center' } }, 'Lab fee paid: ' + money(r.fee, { dp: 2 })));
      } });
    }
    controls(); lists(); sim(); raf = requestAnimationFrame(frame); if(reagents.length) refresh();
    main._paint = () => { lists(); if(!busy) sim(); };
  }

  /* ================= EQUIPMENT ================= */
  function equipTab(root){
    root.appendChild(h('p', { class: 'sub', style: { marginTop: 0 } }, 'Equipment doesn’t unlock a recipe — it changes the physics you can reach: how hot, how squeezed, how fast, and what energy you can feed in.'));
    root.appendChild(group(L.tools().map(t => row({ glyph: 'lab', color: t.owned ? '#4e9a63' : '#7b7468', title: t.name, sub: TOOLTXT[t.id] || t.desc, wrap: true, right: t.owned ? h('span', { class: 'tag good' }, 'Owned') : h('button', { class: 'btn sm', onclick: async e => { e.stopPropagation(); if(await Kit.confirm({ title: 'Buy ' + t.name + '?', msg: money(t.cost) + ' — one-time purchase.', ok: 'Buy' })){ const r = L.buyTool(t.id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); draw(); } } }, money(t.cost)) }))));
  }

  /* ================= LIBRARY ================= */
  function showMolecule(f, by){
    Kit.sheet({ title: pf(f), build: (sb) => {
      const cv = h('canvas', { style: { width: '100%', height: '230px', borderRadius: '16px', background: 'var(--card2)', display: 'block' } }), info = h('div', { style: { marginTop: '12px' } }); sb.append(cv, info);
      const paint = g => { const r = devicePixelRatio || 1, w = cv.clientWidth || 320; cv.width = w * r; cv.height = 230 * r; const c = cv.getContext('2d'); c.setTransform(r, 0, 0, r, 0, 0); c.clearRect(0, 0, w, 230); if(g && g.a.length) drawGraph(c, w, 230, g); };
      paint(L.graph(f)); const d = L.describe(f);
      L.identify(f).then(id => { if(!id) return; paint(id.graph); info.innerHTML = ''; info.append(h('div', { class: 'eq' }, id.name || f), h('div', { class: 'chips' }, h('span', { class: 'tag ' + (id.real ? 'good' : 'warn') }, id.real ? 'Known real-world compound' : 'Structure built from valence rules'), id.cid ? h('a', { class: 'tag tint', href: 'https://pubchem.ncbi.nlm.nih.gov/compound/' + id.cid, target: '_blank', rel: 'noopener' }, 'PubChem ' + id.cid) : null, d ? h('span', { class: 'tag' }, d.category) : null), d && d.mass ? h('div', { class: 'sub' }, 'Molar mass ' + d.mass.toFixed(2) + ' g/mol') : null, by ? h('div', { class: 'sub' }, 'First made by ' + by) : null, id.real ? null : h('div', { class: 'foot' }, 'PubChem has no match for this formula, so the bonds shown are a plausible valence-correct construction, not a measured structure.')); });
    } });
  }
  function foundTab(root){
    const mine = L.found(), ci = L.cacheInfo(), listBox = h('div'), kp = h('div', { class: 'kpis' }), q = h('input', { class: 'field', placeholder: 'Search compounds', style: { margin: '12px 0' } }); let world = {};
    root.append(kp, q, listBox);

      const s = q.value.toLowerCase(), formulas = x => String(x || '').split(',').filter(Boolean); listBox.innerHTML = '';
      const mineRows = mine.slice().reverse().filter(f => !s || (f + ' ' + CH.nameOf(f)).toLowerCase().includes(s));
      listBox.appendChild(h('h2', { class: 'sec' }, 'Your discoveries'));
      listBox.appendChild(mineRows.length ? group(mineRows.map(f => row({ left: h('div', { class: 'mono', style: { width: '78px', color: 'var(--tint)', fontSize: '15px' }, html: pf(f) }), title: CH.nameOf(f), sub: world[f] ? 'First found by ' + world[f].by : 'Only you so far', onClick: () => showMolecule(f, world[f] && world[f].by) }))) : h('div', { class: 'empty', html: Kit.icon('flask', 48, 1.4) + (mine.length ? 'No match.' : 'Nothing yet.<br>Combine reagents in the reactor to discover compounds.') }));

      listBox.appendChild(all.length ? group(all.map(f => row({ left: h('div', { class: 'mono', style: { width: '78px', fontSize: '15px' }, html: pf(f) }), title: CH.nameOf(f), sub: 'First made by ' + world[f].by, right: world[f].t ? Kit.ago(world[f].t) : '', onClick: () => showMolecule(f, world[f].by) }))) : h('div', { class: 'sub' }, 'Loading the shared library…'));
