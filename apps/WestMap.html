<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WestMap</title>
<link rel="stylesheet" href="../os/tokens.css"><link rel="stylesheet" href="../os/app/kit.css">
<style>
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--label);font-family:var(--font)}
#wm{display:flex;height:100%;position:relative} #cv{flex:1;min-width:0;display:block;touch-action:none;cursor:grab;outline:0} #cv.drag{cursor:grabbing}
#side{width:340px;max-width:44%;display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--sep,rgba(255,255,255,.08))}
#tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--sep,rgba(255,255,255,.08))} #tabs button{flex:1;border:0;background:transparent;color:var(--label2);font:700 13px var(--font);padding:8px 4px;border-radius:9px;cursor:pointer} #tabs button.on{background:var(--tint-dim);color:var(--tint2)}
#pane{flex:1;overflow:auto;padding:12px 14px 18px}
#bar{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 380px)} .chip{background:var(--material,var(--card));backdrop-filter:blur(14px);border:1px solid var(--sep,rgba(255,255,255,.1));color:var(--label);border-radius:999px;padding:6px 11px;font:700 12.5px var(--font);cursor:pointer;display:flex;gap:6px;align-items:center} .chip.on{background:var(--tint);color:#fff;border-color:transparent} .chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
#zoom{position:absolute;left:10px;bottom:12px;display:flex;flex-direction:column;gap:6px} #zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--sep,rgba(255,255,255,.1));background:var(--material,var(--card));color:var(--label);font:700 18px var(--font);cursor:pointer}
#legend{position:absolute;left:56px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;font:600 11.5px var(--font);color:var(--label2);background:var(--material,var(--card));padding:6px 10px;border-radius:10px} #legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
h3{margin:0 0 4px;font:800 18px var(--font);letter-spacing:-.01em} .sub{color:var(--label2);font:500 13px/1.4 var(--font)} .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font:500 13.5px var(--font)} .kv span:nth-child(odd){color:var(--label2)} .kv span:nth-child(even){text-align:right;font-weight:700}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--tint);color:#fff;font:700 14px var(--font);cursor:pointer;width:100%;margin:5px 0} .btn.sec{background:var(--fill,rgba(255,255,255,.1));color:var(--label)} .btn.bad{background:var(--bad)} .btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:14px;padding:12px 13px;margin:10px 0} .row2{display:flex;gap:8px;align-items:center} input,select{background:var(--card2,var(--card));color:var(--label);border:1px solid var(--sep,rgba(255,255,255,.12));border-radius:9px;padding:8px 10px;font:600 14px var(--font);width:100%;box-sizing:border-box}
.ev{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--sep,rgba(255,255,255,.07));cursor:pointer} .ev .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 15px var(--font);color:#fff;flex:none}
.tag{display:inline-block;border-radius:6px;padding:2px 7px;font:700 11px var(--font);background:var(--fill,rgba(255,255,255,.1));margin-right:4px} .good{color:var(--good)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
@media (max-width:760px){#wm{flex-direction:column}#side{width:auto;max-width:none;height:46%;border-left:0}#bar{max-width:calc(100% - 20px)}}
.chip.on{background:var(--tint);color:#fff;border-color:transparent} .btn.mini{width:auto;padding:6px 10px;font-size:12.5px;margin:2px 4px 2px 0;display:inline-block} .who{display:flex;gap:8px;align-items:center;margin:2px 0} .who i{width:10px;height:10px;border-radius:50%;flex:none} #tip{position:absolute;pointer-events:none;background:var(--material,var(--card));backdrop-filter:blur(10px);border:1px solid var(--sep,rgba(255,255,255,.12));border-radius:9px;padding:5px 9px;font:700 12px var(--font);display:none;max-width:240px;z-index:3}
#zoom button.on{background:var(--tint);color:#fff;border-color:transparent} #b3d{font:800 12.5px var(--font)!important} #zoom svg{width:18px;height:18px;vertical-align:middle;transition:transform .15s} #head{padding:8px 8px 0}
</style></head><body><div id="wm"><canvas id="cv"></canvas><div id="bar"></div><div id="zoom"><button id="b3d" title="Switch between 2D and 3D">3D</button><button id="bcomp" title="Point north"><svg viewBox="0 0 24 24"><path d="M12 3l4.2 9H7.8z" fill="#e5484d"/><path d="M12 21l-4.2-9h8.4z" fill="currentColor" opacity=".45"/></svg></button><button id="bloc" title="Show my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 4 4 11l7 2 2 7z"/></svg></button><button data-z="1">+</button><button data-z="-1">−</button><button data-z="0" title="Fit">⌂</button></div><div id="legend"></div><div id="tip"></div>
<div id="side"><div id="head"><input id="q" type="search" placeholder="Search houses, places, people" autocomplete="off"></div><div id="tabs"></div><div id="pane"></div></div></div></div>
<script src="../os/icons.js"></script><script src="../os/app/kit.js"></script><script src="../os/lib/maprender.js"></script><script src="../os/lib/house3d.js"></script>
<script>
const H = OS.homes, G = H.gen, { h, money, esc } = Kit, $ = s => document.querySelector(s);
const cv = $('#cv'), DAY = 86400000, HOUR = 3600000, MIN = 60000;
let me = null, world = {}, list = [], byId = {}, bots = {}, botList = [], owners = {}, sel = null, selX = null, follow = null, tab = 'info', filter = { mine: 0, sale: 0, rent: 0, fire: 0 }, layers = { npc: 1, ppl: 1 };
let fitted = false, need = true, vehicles = [], seenEv = new Set(), firstEv = true, plots = {}, locs = {}, homesAll = {}, anim = {}, npcPos = [], pplPos = [];
const dark = () => document.documentElement.dataset.theme !== 'light';
const isBot = o => /^b\d+$/.test(o), fmt0 = n => '$' + Math.round(n).toLocaleString(), fmt2 = n => '$' + (+n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const COL = { mine: '#5bd68a', bank: '#b3b9c4', player: '#7fb2f2', bot: '#f2b676' };
const kind = hs => hs.o === me ? 'mine' : hs.o === 'bank' ? 'bank' : isBot(hs.o) ? 'bot' : 'player';
const toast = (m, ok) => Kit.toast(m, ok ? 'good' : 'bad');
const nd = () => G.districtCount(list.length || 512), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PC = { bank: ['#4a6fa8', 'B'], exchange: ['#3fae78', 'E'], shop: ['#d9a441', 'S'], arcade: ['#b36be0', 'A'], agency: ['#c98a62', 'R'], hall: ['#7c8696', 'C'], park: ['#5d8f4a', 'P'], uni: ['#6f7fd0', 'U'], lab: ['#52b5b0', 'L'], ind: ['#c0764a', 'F'], plant: ['#8a6a58', 'W'] };
const POI_APP = { bank: 'Bank', exchange: 'Stocks', shop: 'WestShop', arcade: 'Arcade', agency: 'RealEstate', lab: 'WestLab' };
const POI_INFO = { bank: 'Deposits, loans and your tax bills.', exchange: 'Where $WEST shares are traded.', shop: 'Buy and sell elements and tools.', arcade: 'The casino. You must have a home to play.', agency: 'Houses for sale and rent.', hall: 'The council: licences, building orders and emergency services.', park: 'Central Park. Nice for a stroll.', uni: 'The University Library, a favourite of teachers and students.', lab: 'The Research Institute. Chemists and lab techs work here.', ind: 'The Freight Depot of the Industrial Estate.', plant: 'The power plant that keeps the factories running.' };

/* ---------- data ---------- */
function rebuild(){
  world = H.world(); const ids = Object.keys(world); owners = {};
  list = ids.map(id => { let e = byId[id]; if(!e){ e = byId[id] = { id, g: H.house(id) }; } e.h = world[id]; if(e.h.o && !isBot(e.h.o) && e.h.o !== 'bank' && e.h.on) owners[e.h.o] = e.h.on; return e; }).filter(e => e.h); need = true;
  if(!fitted && list.length){ fit(); fitted = true; } if(pendingFocus && byId[pendingFocus]){ const f = pendingFocus; pendingFocus = null; setTimeout(() => focus(f), 0); } if(sel && !world[sel]) sel = null; mapData(); paintSide();
}
function events(){ const ev = H.events(); Object.keys(ev).forEach(k => { if(seenEv.has(k)) return; seenEv.add(k); const e = ev[k]; if(!firstEv && Date.now() - e.t < 15 * 60000) launch(e); }); firstEv = false; }
const nameOf = uid => uid === me ? 'You' : (locs[uid] && locs[uid].n) || owners[uid] || 'A player';
function mapData(){ plots = H.plots(); locs = H.locs(); homesAll = H.allHomes(); const now = Date.now(), n = nd();
  Object.keys(locs).forEach(uid => { const l = locs[uid]; if(!l || !l.p || now - l.t > 12 * MIN) { delete anim[uid]; return; }
    const hid = homesAll[uid] && homesAll[uid].h, to = G.playerPlace(l.p, uid, hid), a = anim[uid];
    if(!a){ anim[uid] = { place: l.p, hid, cur: to, to, rt: null, t0: 0, dur: 1 }; }
    else if(a.place !== l.p || a.hid !== hid){ const rt = G.route(a.cur, to, n), L = G.lenOf(rt); anim[uid] = { place: l.p, hid, cur: a.cur, from: a.cur, to, rt: L > 3 ? rt : null, t0: performance.now(), dur: clamp(L / 70 * 1000, 2500, 8000) }; } });
  Object.keys(anim).forEach(uid => { if(!locs[uid] || now - locs[uid].t > 12 * MIN) delete anim[uid]; }); need = true; }
function playerXY(uid, now){ const a = anim[uid]; if(!a) return null; if(a.rt){ const f = (now - a.t0) / a.dur; if(f >= 1){ a.rt = null; a.cur = a.to; } else { const p = G.posAlong(a.rt, f); a.cur = { x: p.x, y: p.y, node: a.to.node }; return { x: p.x, y: p.y, moving: true, a: p.a }; } } return { x: a.to.x, y: a.to.y, moving: false }; }
OS.on('world', () => { rebuild(); events(); if(tab === 'feed') paintSide(); }); OS.on('mapdata', () => { mapData(); if(tab === 'places' || (selX && tab === 'info')) paintSideSoon(); }); OS.on('plots', () => { if(tab === 'places') paintSide(); });
OS.on('home', paintSide); OS.on('cash', Kit.debounce(() => { if(tab === 'me') paintSide(); }, 400)); OS.on('eco', () => { if(tab === 'eco') paintSide(); });
const paintSideSoon = Kit.debounce(() => paintSide(), 250);
async function loadBots(){ try{ bots = await H.bots(); botList = Object.keys(bots).map(id => { const r = bots[id]; return { id, n: +id.slice(1), rec: r, b: { n: +id.slice(1), job: r.j || 'baker', thrift: typeof r.th === 'number' ? r.th : 0.5 }, home: r.h ? G.house(+String(r.h).slice(1)) : null }; }); need = true; if(tab === 'info' || tab === 'eco') paintSide(); }catch(e){} }

/* ---------- view ---------- */
const R = MapRender.create(cv, G), V = R.view, MAXP = 1.12, POIH = { bank: 30, exchange: 40, shop: 18, arcade: 22, agency: 20, hall: 28, uni: 24, lab: 22, ind: 16, plant: 26 };
function resize(){ R.resize(); need = true; }
addEventListener('resize', resize); new ResizeObserver(resize).observe(cv);
function fit(){ R.fit(G.bounds(list.length || 512)); goal = null; paint3d(); need = true; }
function focusXY(x, y, k){ follow = null; V.k = Math.max(V.k, k || 3.4); V.x = x; V.y = y; need = true; }
function focus(id){ const e = byId[id]; if(!e) return; sel = id; selX = null; focusXY(e.g.x, e.g.y); tab = 'info'; paintSide(); }
function zoomAt(f, px, py){ const w0 = R.unproject(px, py); V.k = clamp(V.k * f, 0.16, 9); const w1 = R.unproject(px, py); if(w0 && w1){ V.x += w0[0] - w1[0]; V.y += w0[1] - w1[1]; } need = true; }
/* 3D: a tween of the pitch (and bearing); the buttons, the compass and right-drag all drive the same view */
let goal = null; const flat = () => V.p < 0.035;
function set3D(on){ goal = { p: on ? 0.95 : 0, b: on ? V.b : 0 }; }
function paint3d(){ const b = $('#b3d'); b.textContent = goal ? (goal.p > 0 ? '2D' : '3D') : (V.p > 0.1 ? '2D' : '3D'); b.classList.toggle('on', goal ? goal.p > 0 : V.p > 0.1); $('#bcomp svg').style.transform = 'rotate(' + V.b + 'rad)'; }
function tween(){ if(!goal) return; V.p += (goal.p - V.p) * 0.14; V.b += (goal.b - V.b) * 0.14; if(Math.abs(goal.p - V.p) < 0.004 && Math.abs(goal.b - V.b) < 0.004){ V.p = goal.p; V.b = goal.b; goal = null; } paint3d(); }
$('#b3d').onclick = () => set3D(goal ? !(goal.p > 0) : V.p < 0.1); $('#bcomp').onclick = () => { goal = { p: V.p, b: Math.round(V.b / (2 * Math.PI)) * 2 * Math.PI }; }; $('#bloc').onclick = () => { const p = playerXY(me, performance.now()); if(p){ focusXY(p.x, p.y, 3.2); follow = { t: 'player', id: me }; return; } const hid = homesAll[me] && homesAll[me].h; if(hid && byId[hid]) return focus(hid); focusXY(G.CORE.x, G.CORE.y, 2.4); };
let drag = null; const pts = new Map(); const dist2 = () => { const p = [...pts.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }, ang2 = () => { const p = [...pts.values()]; return Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x); };
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.offsetX, y: e.offsetY }); goal = null; drag = { x: e.offsetX, y: e.offsetY, moved: 0, mode: (e.button === 2 || e.shiftKey || e.altKey || e.ctrlKey) ? 'rot' : 'pan', d0: pts.size === 2 ? dist2() : 0, a0: pts.size === 2 ? ang2() : 0, k0: V.k, b0: V.b }; cv.classList.add('drag'); });
cv.addEventListener('pointermove', e => { if(!pts.has(e.pointerId)){ hover(e); return; } const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if(pts.size === 2 && drag){ drag.moved = 99; const d = dist2(), a = ang2(), c = [...pts.values()]; if(drag.d0 > 0){ zoomAt(clamp(drag.k0 * d / drag.d0, 0.16, 9) / V.k, (c[0].x + c[1].x) / 2, (c[0].y + c[1].y) / 2); V.b = drag.b0 + (a - drag.a0); paint3d(); need = true; } else { drag.d0 = d; drag.a0 = a; } return; }
  if(!drag) return; const dx = e.offsetX - prev.x, dy = e.offsetY - prev.y; drag.moved += Math.abs(dx) + Math.abs(dy);
  if(drag.mode === 'rot'){ V.b += dx * 0.008; V.p = clamp(V.p - dy * 0.006, 0, MAXP); paint3d(); need = true; return; }
  if(drag.moved > 6) follow = null; const a = R.unproject(prev.x, prev.y), b = R.unproject(e.offsetX, e.offsetY); if(a && b){ V.x += a[0] - b[0]; V.y += a[1] - b[1]; } need = true; });
cv.addEventListener('pointerup', e => { pts.delete(e.pointerId); cv.classList.remove('drag'); if(drag && drag.moved < 6 && pts.size === 0 && drag.mode === 'pan'){ const r = hit(e.offsetX, e.offsetY); if(r && r.t === 'house'){ sel = r.id; selX = null; } else if(r){ selX = r; } else { sel = null; selX = null; } tab = 'info'; need = true; paintSide(); } if(!pts.size) drag = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); if(e.shiftKey){ V.b += e.deltaY * 0.004; V.p = clamp(V.p + e.deltaX * 0.004, 0, MAXP); paint3d(); return; } zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.offsetX, e.offsetY); }, { passive: false });
document.querySelectorAll('#zoom button[data-z]').forEach(b => b.onclick = () => { const z = +b.dataset.z; follow = null; if(!z) fit(); else zoomAt(z > 0 ? 1.4 : 1 / 1.4, cv.clientWidth / 2, cv.clientHeight / 2); });
/* what is under the pointer: a person first, then a building, then a plot, then a house (everything is projected, so it works tilted and rotated) */
const lift = z => flat() ? 0 : z, BG = G.BuildGen || null, hOf = g => BG ? BG.shape(g).h : g.ht, poiH = id => { const L = BG && BG.landmark(id); return L ? L.h : (POIH[id] || 0); };
function pickHouse(px, py){ let best = null, bd = Math.max(8, 6 * V.k) ** 2; for(const e of list){ const s = R.project(e.g.x, e.g.y, lift(hOf(e.g) * 0.6)); if(!s) continue; const dx = s[0] - px, dy = s[1] - py, d = dx * dx + dy * dy; if(d < bd){ bd = d; best = e.id; } } return best; }
function hit(px, py){
  let best = null, bd = 120;
  for(const p of pplPos){ const s = R.project(p.x, p.y, lift(3)); if(!s) continue; const d = (s[0] - px) ** 2 + (s[1] - py) ** 2; if(d < bd + 40){ bd = d; best = { t: 'player', id: p.id }; } }
  if(!best) for(const p of npcPos){ const s = R.project(p.x, p.y, lift(1.5)); if(!s) continue; const d = (s[0] - px) ** 2 + (s[1] - py) ** 2; if(d < bd){ bd = d; best = { t: 'npc', id: p.id }; } }
  if(best) return best;
  for(const id in G.POIS){ if(id === 'hub') continue; const p = G.POIS[id], s = R.project(p.x, p.y, lift(poiH(id) + 10)); if(s && Math.hypot(s[0] - px, s[1] - py) < 17) return { t: 'poi', id }; }
  for(const uid in plots){ for(const kd of ['f', 'l']){ if(!plots[uid][kd]) continue; const c = G.plotCell(kd, uid), s = R.project(c.x, c.y, 0); if(s && Math.abs(s[0] - px) < c.w * V.k * s[2] / 2 + 3 && Math.abs(s[1] - py) < c.h * V.k * s[2] / 2 + 3) return { t: 'plot', id: uid, kd }; } }
  const hs = pickHouse(px, py); return hs ? { t: 'house', id: hs } : null;
}
const tip = $('#tip');
function hover(e){ const r = hit(e.offsetX, e.offsetY); cv.style.cursor = r ? 'pointer' : 'grab'; let txt = '';
  if(r){ if(r.t === 'npc'){ const b = bots[r.id]; txt = b ? b.n + ' · ' + b.j : ''; } else if(r.t === 'player') txt = nameOf(r.id); else if(r.t === 'poi') txt = G.POIS[r.id].n; else if(r.t === 'plot') txt = (r.kd === 'f' ? 'Factory plot · ' : 'Laboratory · ') + nameOf(r.id); else if(r.t === 'house'){ const e2 = byId[r.id]; txt = e2 ? e2.g.addr + ' · ' + e2.g.typeName : ''; } }
  if(txt){ tip.textContent = txt; tip.style.display = 'block'; tip.style.left = Math.min(cv.clientWidth - 200, e.offsetX + 14) + 'px'; tip.style.top = (e.offsetY + 14) + 'px'; } else tip.style.display = 'none'; }
cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; });

function shown(e){ const hs = e.h; if(filter.mine && hs.o !== me) return false; if(filter.sale && !(hs.a > 0 || hs.o === 'bank')) return false; if(filter.rent && !(hs.rh > 0 && !hs.t)) return false; if(filter.fire && !(hs.dm > 0)) return false; return true; }
function remaining(rt, f){ const tot = G.lenOf(rt); if(f <= 0) return rt; let d = f * tot; for(let i = 1; i < rt.length; i++){ const sl = Math.hypot(rt[i][0] - rt[i - 1][0], rt[i][1] - rt[i - 1][1]); if(d <= sl){ const u = sl ? d / sl : 0; return [[rt[i - 1][0] + (rt[i][0] - rt[i - 1][0]) * u, rt[i - 1][1] + (rt[i][1] - rt[i - 1][1]) * u]].concat(rt.slice(i)); } d -= sl; } return [rt[rt.length - 1]]; }
function npcAt(nb, now){ return G.npcState(nb.b, nb.home, now, nd()); }
function drawScene(t){ const now = Date.now(), pn = performance.now();
  const npcs = []; if(layers.npc) for(const nb of botList){ const st = npcAt(nb, now); npcs.push({ id: nb.id, x: st.x, y: st.y, moving: st.moving, c: nb.rec.c, name: nb.rec.n }); }
  const players = []; if(layers.ppl) for(const uid in anim){ const p = playerXY(uid, pn); if(!p) continue; players.push({ id: uid, x: p.x, y: p.y, mine: uid === me, name: nameOf(uid) }); }
  let npcSel = null; if(selX && selX.t === 'npc'){ const nb = botList.find(q => q.id === selX.id); if(nb){ const st = npcAt(nb, now); npcSel = { route: st.moving ? st.route : null, rest: st.moving ? remaining(st.route, st.f) : null, to: st.to }; } }
  vehicles = vehicles.filter(v => pn - v.t0 < v.dur + 2500);
  R.draw({ dark: dark(), n: nd(), houses: list, plots, npcs, players, vehicles, sel, selX, npcSel, shown, kind, me }, t); npcPos = R.npcPos; pplPos = R.pplPos; }

function launch(ev){ const types = ev.k === 'fire' ? ['fire'] : ev.k === 'police' ? ['police'] : ['ambulance'], e = byId[ev.h]; if(!e) return; const nd = G.districtCount(list.length); let best = null, bd = 1e12;
  for(let k = 0; k < nd; k++){ const s = G.stations(k).find(q => q.t === types[0]), dd = (s.x - e.g.x) ** 2 + (s.y - e.g.y) ** 2; if(dd < bd){ bd = dd; best = s; } }
  if(best) vehicles.push({ t: types[0], from: best, to: e.g, t0: performance.now(), dur: 5000 + Math.min(4000, Math.sqrt(bd) * 18), label: ev.k === 'fire' ? 'Fire crew' : ev.k === 'police' ? 'Police' : 'Ambulance' }); need = true; }
let lastDraw = 0, lastFrame = 0;
(function loop(t){ requestAnimationFrame(loop); if(document.hidden || t - lastDraw < 28) return; lastDraw = t; tween();
  if(follow){ let p = null; if(follow.t === 'npc'){ const nb = botList.find(q => q.id === follow.id); if(nb) p = npcAt(nb, Date.now()); } else if(follow.t === 'player') p = playerXY(follow.id, performance.now()); if(p){ V.x += (p.x - V.x) * 0.18; V.y += (p.y - V.y) * 0.18; } }
  drawScene(t); })(0);

  p.append(btn('Ask the city to build more houses', async () => { const r = await H.requestHousing(); toast(r.msg, r.ok); }, 'sec'));
}
