<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WestShop</title>
<link rel="stylesheet" href="../os/tokens.css"><link rel="stylesheet" href="../os/app/kit.css">
<style>
.egrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; }
.el{ background:var(--card); border-radius:18px; padding:10px 10px 11px; text-align:left; position:relative; overflow:hidden; transition:transform .25s var(--spring); display:flex; flex-direction:column; min-height:104px; }
.el:active{ transform:scale(.95); } .el::before{ content:""; position:absolute; inset:0; background:var(--c); opacity:.14; } .el>*{ position:relative; }
.el .n{ font:600 11px var(--font); color:var(--label2); } .el .s{ font:800 30px/1.05 var(--font); letter-spacing:-.03em; color:var(--c); margin:2px 0; } .el .nm{ font:500 12px/1.2 var(--font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .el .p{ margin-top:auto; padding-top:6px; font:700 13.5px var(--font); font-variant-numeric:tabular-nums; display:flex; flex-direction:column; min-height:34px; }
.el .own{ position:absolute; top:8px; right:8px; min-width:20px; height:20px; border-radius:10px; background:var(--tint); color:#fff; font:700 11.5px/20px var(--font); text-align:center; padding:0 6px; }
.mv{ font:700 11px var(--font); } .mv.u{ color:var(--good); } .mv.d{ color:var(--bad); }
.movers{ display:flex; gap:10px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; } .movers::-webkit-scrollbar{ display:none; }
.mover{ flex:none; width:112px; background:var(--card); border-radius:16px; padding:10px 12px; } .mover b{ font:800 22px var(--font); color:var(--c); } .mover small{ display:block; color:var(--label2); font:500 12px var(--font); } .mover .mv{ font-size:15px; }
.fx{ font:700 17px/1.2 var(--font); } .big-s{ font:800 54px/1 var(--font); letter-spacing:-.04em; color:var(--c); }
.qrow{ display:flex; gap:8px; margin:12px 0; } .qrow .field{ text-align:center; font:700 22px var(--font); height:52px; }
.formula{ font-family:var(--font); font-weight:700; letter-spacing:.01em; }
</style></head><body><div id="app"></div>
<script src="../os/icons.js"></script><script src="../os/app/kit.js"></script>
<script>
const { h, row, group, money, esc } = Kit, SH = OS.shop, CH = OS.chem, COLORS = OS.data.CATEGORY_COLORS, CATL = OS.data.CATEGORY_LABELS;
let tab = 'elements', q = '', cat = 'all';
const pf = f => CH.prettyFormula(f);
const mvTag = m => Math.abs(m - 1) < 0.02 ? null : h('span', { class: 'mv ' + (m > 1 ? 'u' : 'd') }, (m > 1 ? '▲ +' : '▼ −') + Math.abs(Math.round((m - 1) * 100)) + '%');
const A = Kit.app({ title: 'WestShop', build: (body) => {
  const tabs = Kit.seg([{ id: 'elements', label: 'Elements' }, { id: 'compounds', label: 'Compounds' }, { id: 'inventory', label: 'My items' }], tab, t => { tab = t; q = ''; cat = 'all'; draw(); });
  const search = h('div', { class: 'search', style: { marginTop: '12px' } }, h('span', { html: Kit.icon('search', 17, 2) }), h('input', { class: 'field', placeholder: 'Search', oninput: e => { q = e.target.value.toLowerCase(); list(); } }));
  const chips = h('div', { class: 'chips', style: { marginTop: '10px' } }), main = h('div', { style: { marginTop: '12px' } }), top = h('div');
  body.append(tabs, top, search, chips, main);
  function draw(){ search.style.display = tab === 'inventory' ? 'none' : ''; search.querySelector('input').value = ''; paintTop(); paintChips(); list(); }
  function paintTop(){
    top.innerHTML = ''; if(tab !== 'elements') return; const mv = SH.movers(), keys = Object.keys(mv).filter(k => Math.abs(mv[k] - 1) >= 0.03).sort((a, b) => Math.abs(mv[b] - 1) - Math.abs(mv[a] - 1)).slice(0, 8);
    if(!keys.length) return; top.appendChild(h('h2', { class: 'sec', style: { marginTop: '18px' } }, 'In the news', h('a', { onclick: () => OS.open('News') }, 'Read')));
    top.appendChild(h('div', { class: 'movers' }, ...keys.map(k => { const e = CH.elements[k], el = h('button', { class: 'mover', style: { '--c': COLORS[e.cat] || 'var(--tint)' }, onclick: () => openItem('element', k) }, h('b', null, k), h('small', null, e.name), mvTag(mv[k])); return el; })));
  }
  function paintChips(){
    chips.innerHTML = ''; if(tab === 'inventory') return;
    const cats = tab === 'elements' ? ['all', ...new Set(OS.data.ELEMENTS.map(e => e[4]))] : ['all', ...new Set(SH.compounds().map(c => c.category))];
    cats.forEach(c => chips.appendChild(h('button', { class: 'chip' + (c === cat ? ' on' : ''), onclick: () => { cat = c; paintChips(); list(); } }, c === 'all' ? 'All' : (CATL[c] || c[0].toUpperCase() + c.slice(1).replace(/-/g, ' ')))));
  }
  function list(){
    main.innerHTML = '';
    if(tab === 'elements'){
      const rows = SH.elements().filter(e => (cat === 'all' || e.cat === cat) && (!q || (e.name + e.sym).toLowerCase().includes(q)));
      main.appendChild(h('div', { class: 'egrid' }, ...rows.map(e => h('button', { class: 'el', style: { '--c': COLORS[e.cat] || '#c9a876' }, onclick: () => openItem('element', e.sym) }, e.qty ? h('span', { class: 'own' }, Kit.num(e.qty)) : null, h('span', { class: 'n' }, e.num), h('span', { class: 's' }, e.sym), h('span', { class: 'nm' }, e.name), h('span', { class: 'p' }, money(e.price, { compact: true, dp: e.price < 100 ? 2 : 0 }), ' ', mvTag(e.mult))))));
      if(!rows.length) main.appendChild(h('div', { class: 'empty' }, 'No elements match.'));
    } else if(tab === 'compounds'){
      const rows = SH.compounds().filter(c => (cat === 'all' || c.category === cat) && (!q || (c.name + c.formula).toLowerCase().includes(q)));
      main.appendChild(rows.length ? group(rows.map(c => row({ left: h('div', { class: 'formula', style: { width: '74px', fontSize: '15px', color: 'var(--tint)' }, html: pf(c.formula) }), title: c.name, sub: c.desc || c.category, right: h('div', { style: { textAlign: 'right' } }, h('b', { class: 'num' }, money(c.price, { dp: 2 })), c.qty ? h('div', { class: 'dim', style: { fontSize: '12px' } }, 'own ' + Kit.num(c.qty)) : mvTag(c.mult)), onClick: () => openItem('compound', c.formula) }))) : h('div', { class: 'empty' }, 'No compounds match.'));
    } else {
      const inv = SH.inventory(); let tot = 0; inv.forEach(i => { tot += i.sell * i.qty; });
      if(!inv.length) return main.appendChild(h('div', { class: 'empty', html: Kit.icon('shop', 56, 1.4) + 'Your bag is empty.<br>Buy elements, make compounds in WestLab, or win some in Games.' }));
      main.appendChild(h('div', { class: 'kpis', style: { marginBottom: '14px' } }, h('div', { class: 'kpi' }, h('small', null, 'Items owned'), h('b', null, Kit.num(inv.reduce((s, i) => s + i.qty, 0)))), h('div', { class: 'kpi' }, h('small', null, 'Sells for about'), h('b', null, money(tot, { compact: true })))));
      main.appendChild(group(inv.map(i => row({ left: i.type === 'element' ? h('div', { class: 'formula', style: { width: '44px', fontSize: '24px', color: COLORS[CH.elements[i.key].cat] || 'var(--tint)' } }, i.key) : h('div', { class: 'formula', style: { width: '74px', fontSize: '15px', color: 'var(--tint)' }, html: pf(i.key) }), title: i.name, sub: Kit.num(i.qty) + ' owned · sells ' + money(i.sell, { dp: 2 }) + ' each', right: h('b', { class: 'num' }, money(i.sell * i.qty, { dp: 2 })), onClick: () => openItem(i.type, i.key) }))));
      main.appendChild(h('button', { class: 'btn block bad', style: { marginTop: '16px' }, onclick: async () => { if(await Kit.confirm({ title: 'Sell everything?', msg: 'Sell every item for about ' + money(tot, { dp: 2 }) + '. Selling lots of one thing lowers its price.', ok: 'Sell all', destructive: true })){ let got = 0; SH.inventory().forEach(i => { const r = SH.sell(i.key, i.qty); if(r.ok) got += r.total; }); Kit.toast('Sold for ' + money(got, { dp: 2 }), 'good'); list(); } } }, 'Sell everything'));
    }
  }
  function openItem(type, key){
    const isEl = type === 'element', el = isEl ? CH.elements[key] : null, col = isEl ? (COLORS[el.cat] || 'var(--tint)') : 'var(--tint)', info = isEl ? null : CH.describe(key);
    Kit.sheet({ title: isEl ? el.name : (info ? info.name : key), build: (sb, api) => {
      const nq = h('input', { class: 'field', type: 'number', min: '1', step: '1', value: '1', inputmode: 'numeric' }), est = h('div', { class: 'est', style: { display: 'flex', justifyContent: 'space-between', margin: '4px 4px 12px', color: 'var(--label2)', font: '500 15px var(--font)' } }), head = h('div'), stat = h('div');
      const n = () => Math.max(0, Math.floor(parseFloat(nq.value) || 0));
      function paint(){
        const price = SH.price(key), have = SH.qty(type, key), sell = SH.quote(key, Math.min(n(), have || 0)), mult = OS.worldModel.itemMult(key, OS.now());
        head.innerHTML = ''; head.appendChild(h('div', { class: 'hstack', style: { gap: '16px', margin: '4px 0 12px' } }, isEl ? h('div', { class: 'big-s', style: { '--c': col } }, key) : h('div', { class: 'formula', style: { fontSize: '30px', color: 'var(--tint)' }, html: pf(key) }), h('div', null, h('div', { class: 'fx num' }, money(price, { dp: 2 }), ' ', mvTag(mult)), h('div', { class: 'sub' }, isEl ? '#' + el.num + ' · ' + (CATL[el.cat] || el.cat) : (info && info.desc) || 'Compound'))));
        stat.innerHTML = ''; stat.appendChild(group(row({ title: 'You own', right: Kit.num(have) }), row({ title: 'Shop buys back at', sub: 'drops if you sell a lot at once', right: have ? money(SH.sellPrice(key), { dp: 2 }) + ' each' : '—' })));
        const q2 = n(); est.innerHTML = '<span>Buy ' + Kit.num(q2) + '</span><b style="color:var(--label)">' + money(price * q2, { dp: 2 }) + '</b>';
        buyB.disabled = !q2; sellB.disabled = !have || !q2; sellB.textContent = 'Sell' + (have && q2 ? ' · ' + money(SH.quote(key, Math.min(q2, have)).total, { dp: 2 }) : '');
      }
      const buyB = h('button', { class: 'btn good grow', onclick: () => { const r = SH.buy(key, n()); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); paint(); list(); } }, 'Buy'), sellB = h('button', { class: 'btn bad grow', onclick: () => { const r = SH.sell(key, Math.min(n(), SH.qty(type, key))); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); paint(); list(); if(!SH.qty(type, key) && tab === 'inventory') api.close(); } }, 'Sell');
      const pre = [1, 10, 100].map(v => h('button', { class: 'chip', style: { flex: 1, textAlign: 'center', padding: 0 }, onclick: () => { nq.value = v; paint(); } }, '×' + v)); pre.push(h('button', { class: 'chip', style: { flex: 1, textAlign: 'center', padding: 0 }, onclick: () => { nq.value = Math.max(1, Math.floor(OS.cash() / SH.price(key))); paint(); } }, 'Max'), h('button', { class: 'chip', style: { flex: 1, textAlign: 'center', padding: 0 }, onclick: () => { nq.value = Math.max(1, SH.qty(type, key)); paint(); } }, 'All'));
      nq.addEventListener('input', paint); sb.append(head, stat, h('div', { class: 'qrow' }, nq), h('div', { class: 'qrow', style: { margin: '0 0 12px' } }, ...pre), est, h('div', { class: 'hstack' }, buyB, sellB));
      if(!isEl) sb.appendChild(h('div', { class: 'foot' }, 'Tip: you can make this in WestLab from its elements, usually for less than the shop price.'));
      document.addEventListener('shop-refresh', paint); const old = api.close; api.close = function(){ document.removeEventListener('shop-refresh', paint); old(); };
      paint();
    } });
  }
  draw(); ['inv', 'cash'].forEach(e => Kit.live(e, Kit.debounce(() => { list(); }, 150)));
  /* Prices move with the news, so refresh the grid, the movers strip and any open item sheet every 20 s (and when the window regains focus). Skips while someone is typing in the search box. */
  let sig = ''; const refresh = () => { if(document.hidden) return; const a = document.activeElement; if(a && a.tagName === 'INPUT') return; const m = JSON.stringify(OS.world.mults()); if(m === sig) return; sig = m; if(tab === 'elements') paintTop(); list(); document.dispatchEvent(new Event('shop-refresh')); };
  setInterval(refresh, 20000); document.addEventListener('visibilitychange', refresh); window.addEventListener('focus', refresh);
} });
</script></body></html>
