<script>

const pf = f => CH.prettyFormula(f), fm = v => (+v).toFixed(v < 10 && v % 1 ? 1 : 0), m2 = v => money(v, { dp: 2 });

    paint(); ps.oninput = paint; ps.onchange = async () => { const r = await FA.setPrice(l.id, +ps.value); if(!r.ok) Kit.toast(r.msg, 'bad'); refresh(true); };
    const seg = Kit.seg([{ id: 'shop', label: 'WestShop' }, { id: 'market', label: 'Market' }], l.route, async r => { const x = await FA.setRoute(l.id, r); Kit.toast(x.msg, x.ok ? 'good' : 'bad'); refresh(); });
    const live = h('div', { class: 'foot', 'data-live': '1' });
    side.append(head, h('div', { class: 'pb', style: { height: '8px' } }, h('b', { style: { width: Math.min(100, l.stock / l.storage * 100) + '%', background: 'var(--tint)', display: 'block', height: '100%', borderRadius: '4px' } })), h('div', { class: 'foot', style: { margin: '4px 0 12px' } }, fm(l.stock) + ' of ' + l.storage + ' mol in the warehouse' + (l.full ? ' — full, production stalls' : '')), seg,
      h('div', { class: 'ctl' }, h('label', null, 'Your price per mol', pv), ps, shop ? h('div', { class: 'chance', style: { marginTop: '8px' } }, ch) : null, cl, h('div', { class: 'foot', style: { margin: '6px 0 0' } }, 'Allowed ' + m2(rg.lo) + ' – ' + m2(rg.hi) + (shop ? ' · sweet spot is usually just around the estimated value' : ''))),
      h('div', { class: 'row2' }, ...[['×0.9', 0.9], ['×1.0', 1], ['×1.2', 1.2]].map(([t, f]) => h('button', { class: 'chip', style: { textAlign: 'center' }, onclick: () => { ps.value = Math.min(rg.hi, Math.max(rg.lo, l.est * f)); paint(); ps.onchange(); } }, t))),
      shop ? h('div', { class: 'row2' }, h('button', { class: 'btn good', id: 'sellnow', onclick: async () => { const r = FA.sellNow(l.id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); refresh(); } }, 'Sell now'), h('button', { class: 'btn gray', onclick: () => { const r = FA.setAuto(l.id, !l.auto); refresh(); } }, 'Auto-sell: ' + (l.auto ? 'on' : 'off')))
             : h('div', { class: 'row2' }, h('button', { class: 'btn gray', onclick: async () => { const r = await FA.withdraw(l.id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); refresh(); } }, 'Withdraw ' + (l.listed || 0) + ' listed'), h('button', { class: 'btn gray', onclick: () => OS.open('WestShop') }, 'View Market')),
      h('div', { class: 'row2' }, h('button', { class: 'btn gray', onclick: () => { const r = FA.collect(l.id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); refresh(); } }, 'Move stock to my bag')), live);
    tickPanel();
  }
  function tickPanel(){
    const n = sel && NODES[sel]; if(!n || n.kind !== 'wh') return; const l = ST.lines.find(x => x.id === n.l.id), live = side.querySelector('[data-live]'); if(!l || !live) return;
    live.textContent = l.route === 'shop' ? (l.lockLeft > 0 ? 'WestShop sales locked for ' + l.lockLeft + ' s.' : 'Ready to sell.') + (l.note ? ' · ' + l.note : '') : (l.note || (OS.auth.signedIn() ? 'Listings update automatically.' : 'Sign in to sell on the Market.'));
  }
  function refresh(keepPanel){ ST = FA.state(); drawTop(); drawNet(); if(!keepPanel) drawPanel(); }
  Kit.live('factory', Kit.debounce(() => { const was = ST; ST = FA.state(); drawTop(); drawNet(); tickPanel(); }, 120)); Kit.live('cash', Kit.debounce(drawTop.bind(null), 400));
  setInterval(() => { if(document.hidden) return; ST = FA.state(); tickPanel(); drawTop(); }, 2000);
  OS.on && OS.on('factory-sale', d => Kit.toast('Market sale: +' + m2(d.net) + ' (' + d.items + ' mol)', 'good'));
  ST = FA.state(); drawTop(); drawNet(); drawPanel(); setTimeout(() => { ST = FA.state(); drawTop(); drawNet(); }, 300);
  if(!ST.lines.length && !FA.found().length) Kit.toast('Discover compounds in WestLab to unlock production', 'info');
} });
