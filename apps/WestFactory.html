<script>
const { h, row, group, money, num } = Kit, FA = OS.factory, CH = OS.chem, COLORS = OS.data.CATEGORY_COLORS;

let ST = null, sel = null, drag = null, panelBusy = false;

const elSym = sp => (sp || '').replace(/2$/, '');
const elColor = s => COLORS[(CH.elements[s] || {}).cat] || '#c9a876';
function sellCap(l){ if(l.route !== 'shop') return l.rate; const c = Math.max(0.02, l.chance || 0); return Math.min(l.rate, l.batch * c / ((c * 5 + (1 - c) * 60) / 60)); }   // mol/min the shop will actually take at this price

const A = Kit.app({ title: 'WestFactory', right: [{ icon: 'plus', label: 'Add line', onClick: () => addSheet() }], build: (body) => {
  const kp = h('div', { class: 'kp' }), bar = h('div', { class: 'fbar' }), net = h('div', { class: 'net' }), stage = h('div', { class: 'stage' }), side = h('div', { class: 'side' });
  net.appendChild(stage); body.append(kp, bar, h('div', { class: 'wrap' }, net, side), h('div', { class: 'foot' }, 'WestLab discovers molecules; WestFactory mass-produces them. Each line is a small plant: a tree of reactors, with purchased inputs on top and by-products recycled (dashed purple). Inputs are bought automatically at WestShop prices — as elements, or as finished compounds you switch to ‘Buy’ — and the product waits in the warehouse until it sells. Drag nodes to rearrange; click one to control it.'));


  function pos(key, dx, dy){ const p = ST.pos[key]; return p ? { x: p.x, y: p.y } : { x: dx, y: dy }; }
  /* Each line is a tree: reactors are laid out left → right by depth, their purchased inputs sit above them, the warehouse is the last column. */
  function layout(){
    const N = {}; let y0 = 16, maxD = 0;
    ST.lines.forEach(l => l.sheet.reactors.forEach(r => { maxD = Math.max(maxD, r.depth); }));
    const whX = X0 + (maxD + 1) * RXW, hubX = whX + 214, bankX = hubX + 190;
    ST.lines.forEach(l => {
      const sh = l.sheet, byRx = {}; sh.feeds.forEach(f => (byRx[f.to] = byRx[f.to] || []).push(f));
      const maxRows = Math.max(0, ...sh.reactors.map(r => Math.ceil((byRx[r.id] || []).length / 2))), stackH = maxRows ? FG + maxRows * (FH + 14) - 14 : 0, rowH = stackH + RH + 24, used = {}; let rows = 1, finalY = y0 + stackH + 6;

        const fs = byRx[r.id] || [], single = fs.length === 1;
        fs.forEach((f, j) => { const fk = 'fd:' + l.id + ':' + r.id + ':' + f.sp, fx = dx + (single ? (176 - FW) / 2 : (j % 2) * (FW + 8)), fy = dy - FG - FH - Math.floor(single ? 0 : j / 2) * (FH + 14);

  }
  function nodeEl(k, n){

      inner = [h('div', { class: 't' }, sh ? 'WestShop' : 'Player Market'), h('div', { class: 'm' }, fm(mol) + ' mol/min'), h('div', { class: 's' }, ls.length ? ls.length + ' line' + (ls.length > 1 ? 's' : '') : 'no lines')]; }
    else { c = '#4a6fa8'; inner = [h('div', { class: 't' }, 'Bank'), h('div', { class: 'm' }, (ST.perMin.net >= 0 ? '+' : '−') + m2(Math.abs(ST.perMin.net)) + '/min'), h('div', { class: 's' }, 'est. net of input costs')]; }

  }
  function edges(N){
    const E = []; const add = (a, b, flow, color, label, warn, recycle, arc) => { if(N[a] && N[b]) E.push({ a, b, flow, color, label, warn, recycle, arc }); };
    ST.lines.forEach(l => {
      let arcs = 0;
      const sh = l.sheet, tgt = x => x === 'out' ? 'wh:' + l.id : 'rx:' + l.id + ':' + x, on = l.on && l.rate > 0;
      sh.feeds.forEach(f => add('fd:' + l.id + ':' + f.to + ':' + f.sp, tgt(f.to), on ? f.mol : 0, f.el ? elColor(elSym(f.sp)) : GROUND, on && f.mol ? f.spl + ' ' + fm(f.mol) : ''));
      sh.edges.forEach(e => { const ra = sh.reactors.find(q => q.id === e.from), rb = sh.reactors.find(q => q.id === e.to), skip = !e.recycle && ra && rb && rb.depth - ra.depth > 1;   // streams that jump over a reactor (or loop back) arc underneath instead of running behind the cards
        add('rx:' + l.id + ':' + e.from, tgt(e.to), on ? e.mol : 0, e.recycle ? '#a98cff' : (e.to === 'out' ? 'var(--tint)' : '#6aa7ff'), on && e.mol ? (e.recycle ? '↺ ' : '') + e.spl + ' ' + fm(e.mol) : '', false, e.recycle, e.recycle || skip ? arcs++ : null); });
      const out = on ? sellCap(l) : 0; add('wh:' + l.id, 'hub:' + l.route, out, l.route === 'shop' ? '#3fae78' : '#9b7bff', on ? fm(out) + ' mol/min' : '', on && out < l.rate - 0.05);
    });

  }
  function geom(a, b, e){
    const acx = a.x + a.w / 2, bcx = b.x + b.w / 2;
    if(e.arc != null){ const yb = Math.max(a.y + a.h, b.y + b.h) + 40 + e.arc * 24; return 'M' + acx + ',' + (a.y + a.h) + ' C' + acx + ',' + yb + ' ' + bcx + ',' + yb + ' ' + bcx + ',' + (b.y + b.h); }

    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, dx = Math.max(40, Math.abs(x2 - x1) / 2);

  }
  let svg = null, pills = [];
  function drawEdges(N){
    if(svg) svg.remove(); pills.forEach(p => p.remove()); pills = []; const W = stage.offsetWidth, H = stage.offsetHeight;
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H); stage.insertBefore(svg, stage.firstChild);

      const a = N[e.a], b = N[e.b], path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', geom(a, b, e));
      const wdt = e.flow > 0 ? Math.min(11, 2.2 + Math.log2(1 + e.flow) * 1.5) : 2; path.setAttribute('class', 'ef flow' + (e.recycle ? ' rec' : '') + (e.flow > 0 ? '' : ' paused')); path.setAttribute('stroke', e.warn ? '#e6a93a' : e.color); path.setAttribute('stroke-width', wdt); path.style.setProperty('--sp', Math.max(0.35, 1.8 / (1 + Math.log2(1 + e.flow))) + 's'); svg.appendChild(path);

    });

    stage.style.width = Math.max(900, maxX + 30) + 'px'; stage.style.height = Math.max(520, maxY + 96) + 'px';

  /* ---- dragging ---- */

  /* ---- header ---- */
  function drawTop(){
    const p = ST.perMin; kp.innerHTML = '';
    [['Producing', fm(p.mol) + ' mol/min'], ['Input cost', m2(p.cost) + '/min'], ['Est. revenue', m2(p.rev) + '/min'], ['Est. profit', (p.net >= 0 ? '+' : '−') + m2(Math.abs(p.net)) + '/min', p.net >= 0 ? 'pos' : 'neg'], ['Lifetime', num(Math.floor(ST.made)) + ' mol · ' + money(ST.earned, { compact: true, dp: 2 })]]
      .forEach(([t, v, c]) => kp.appendChild(h('div', { class: 'kpi' }, h('small', null, t), h('b', { class: c || '' }, v))));
    bar.innerHTML = ''; bar.append(h('button', { class: 'btn', onclick: () => addSheet() }, 'Add line (' + ST.lines.length + '/' + ST.slots + ')'),
      ST.nextSlotCost != null ? h('button', { class: 'btn gray', onclick: buySlot }, 'Unlock slot · ' + m2(ST.nextSlotCost)) : null, h('span', { class: 'grow' }),
      h('label', { class: 'foot', style: { margin: 0 } }, 'Keep ', h('input', { class: 'field', type: 'number', min: '0', value: String(ST.reserve), style: { width: '90px', display: 'inline-block', height: '34px' }, onchange: e => { const r = FA.setReserve(e.target.value); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); } }), ' in the bank'));
  }
  async function buySlot(){ const r = FA.buySlot(); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); refresh(); }
  /* ---- add line ---- */
  function addSheet(){
    const found = FA.found(); Kit.sheet({ title: 'Build a production line', build: (sb, api) => {
      if(ST.lines.length >= ST.slots){ sb.appendChild(h('div', { class: 'empty' }, 'All ' + ST.slots + ' lines are in use.' + (ST.nextSlotCost != null ? ' Unlock another slot for ' + m2(ST.nextSlotCost) + '.' : ''))); return; }
      const have = new Set(ST.lines.map(l => l.f)), rows = found.filter(c => !have.has(CH.speciesOf ? (CH.speciesOf(c.f) || {}).key || c.f : c.f));
      if(!found.length) return sb.appendChild(h('div', { class: 'empty' }, 'Nothing to produce yet.', h('br'), 'Discover compounds in WestLab first.', h('br'), h('button', { class: 'btn', style: { marginTop: '12px' }, onclick: () => { api.close(); OS.open('WestLab'); } }, 'Open WestLab')));
      sb.appendChild(h('div', { class: 'foot', style: { marginBottom: '8px' } }, 'Only compounds you have discovered in WestLab. Margin is the list value over the input cost per mol.'));
      sb.appendChild(group(rows.map(c => { const mg = c.unitCost > 0 ? Math.round((c.est / c.unitCost - 1) * 100) : 0; return row({ left: h('div', { class: 'formula', style: { width: '74px', fontSize: '15px', color: 'var(--tint)' }, html: pf(c.f) }), title: c.name, sub: 'cost ' + m2(c.unitCost) + ' · value ' + m2(c.est), right: h('b', { style: { color: mg >= 0 ? 'var(--good)' : 'var(--bad)' } }, (mg >= 0 ? '+' : '') + mg + '%'), chevron: false, onClick: () => { const r = FA.addLine(c.f); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); if(r.ok){ sel = 'rx:' + r.id; api.close(); refresh(); } } }); })));

  }

  /* ---- side panel ---- */
  const put = (...a) => side.append(...a.flat().filter(Boolean));
  const lineOf = k => { const id = (k || '').split(':')[1]; return ST.lines.find(l => l.id === id); };
  function drawPanel(){
    side.innerHTML = ''; if(panelBusy) return; const k = sel; if(!k || !NODES[k]) { sel = null; return side.append(h('h3', null, 'Your factory'), h('p', { class: 'sub' }, ST.lines.length ? 'Click a reactor, warehouse or element to control it. Drag to rearrange.' : 'Build a line to start producing.'), h('div', { class: 'foot' }, 'Flow lines show molecules per minute. A thin or amber ⚠ line means a bottleneck — usually the shop refusing your price.')); }
    const n = NODES[k], l = n.l ? ST.lines.find(x => x.id === n.l.id) : null;
    if(n.kind === 'fd'){
      const f = n.f, ln = ST.lines.find(x => x.id === n.l.id); if(!ln) return; const sh = ln.sheet, tg = sh.toggles.find(t => t.sp === f.sp), cur = sh.feeds.find(x => x.id === f.id) || f, to = sh.reactors.find(q => q.id === f.to);
      side.append(h('h3', { html: pf(f.sp) }), h('p', { class: 'sub' }, cur.el ? 'Element — bought automatically from WestShop' : (tg && tg.role === 'made' ? 'Intermediate bought ready-made instead of being made here' : 'Finished compound bought ready-made')),
        group(row({ title: 'Price', right: m2(cur.price) + ' / mol' }), row({ title: 'Goes into', right: to ? '→ ' + to.mainl + ' reactor' : 'warehouse' }), row({ title: 'Uses', right: fm(cur.mol) + ' mol/min' }), row({ title: 'Cost', right: m2(cur.cost) + '/min' })));
