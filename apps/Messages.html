<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages</title>
<link rel="stylesheet" href="../os/tokens.css"><link rel="stylesheet" href="../os/app/kit.css">
<style>
.conv .av{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:#fff; font:700 18px var(--font); flex:none; }
.conv .tx b{ display:flex; justify-content:space-between; gap:8px; } .conv .tx b i{ font:400 13px var(--font); color:var(--label2); font-style:normal; }
.conv .tx small{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.dot{ width:10px; height:10px; border-radius:50%; background:var(--blue); flex:none; }
.thread{ display:flex; flex-direction:column; gap:10px; padding-top:6px; }
.bub{ align-self:flex-start; max-width:min(86%,520px); background:var(--card2); border-radius:20px 20px 20px 6px; padding:11px 15px; animation:rev .45s var(--ease) both; }
.bub.tax{ background:linear-gradient(160deg,rgba(238,98,89,.2),rgba(238,98,89,.08)); box-shadow:inset 0 0 0 1px rgba(238,98,89,.35); } .bub.seize{ background:rgba(238,98,89,.28); box-shadow:inset 0 0 0 1.5px var(--bad); }
.bub.admin{ background:var(--tint-dim); box-shadow:inset 0 0 0 1px var(--tint); }
.bub b{ display:block; font:700 15px/1.3 var(--font); margin-bottom:3px; } .bub p{ margin:0; font:400 15.5px/1.4 var(--font); white-space:pre-wrap; } .bub .tm{ font:400 11.5px var(--font); color:var(--label3); margin-top:6px; }
.bub .go{ margin-top:10px; }
.daystamp{ align-self:center; font:600 12px var(--font); color:var(--label3); margin:8px 0 2px; }
</style></head><body><div id="app"></div>
<script src="../os/icons.js"></script><script src="../os/app/kit.js"></script>
<script>
const { h, row, group, esc, ago } = Kit;
const COLORS = { 'West Bank': '#3b5a8c', 'Mr West': '#c0563a', 'News Desk': '#d9843f', 'WestLab': '#2a8f8a', 'System': '#7b7468' };
const colorOf = n => COLORS[n] || ('hsl(' + ([...n].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % 360) + ' 45% 45%)');
const A = Kit.app({ title: 'Messages', right: [{ icon: 'check', label: 'Mark all read', onClick: () => { OS.mail.readAll(); Kit.toast('All marked as read'); } }], build: (body, P) => {
  const list = h('div'); body.appendChild(list);
  function paint(){
    const all = OS.mail.list(), by = {}; all.forEach(m => (by[m.from] = by[m.from] || []).push(m));
    const convs = Object.keys(by).map(f => ({ from: f, msgs: by[f], last: by[f][0], unread: by[f].filter(m => !m.read).length })).sort((a, b) => b.last.t - a.last.t);
    list.innerHTML = '';
    if(!convs.length){ list.appendChild(h('div', { class: 'empty', html: Kit.icon('messages', 56, 1.4) + 'No messages yet.<br>Notices from the bank, the lab and Mr West will appear here.' })); return; }
    list.appendChild(group(convs.map(c => row({ cls: 'conv', left: h('div', { class: 'av', style: { background: colorOf(c.from) } }, c.from[0]), title: c.from, sub: (c.last.subj || c.last.body), wrap: true,
      right: h('span', { class: 'hstack', style: { gap: '8px' } }, h('span', { class: 'dim', style: { fontSize: '13px' } }, ago(c.last.t)), c.unread ? h('span', { class: 'dot' }) : null), chev: true, onClick: () => openThread(c.from) }))));
  }
  function openThread(from){
    const T = A.push({ title: from, large: false, backLabel: 'Messages', right: [{ icon: 'trash', label: 'Delete conversation', onClick: async () => { if(await Kit.confirm({ title: 'Delete conversation?', msg: 'All messages from ' + from + ' will be removed.', ok: 'Delete', destructive: true })){ OS.mail.list().filter(m => m.from === from).forEach(m => OS.mail.remove(m.id)); A.pop(); } } }], build: (b, pg) => {
      const th = h('div', { class: 'thread' }); b.appendChild(th);
      function draw(){
        th.innerHTML = ''; const msgs = OS.mail.list().filter(m => m.from === from).reverse(); let day = '';
        msgs.forEach(m => {
          const d = new Date(m.t).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' }); if(d !== day){ day = d; th.appendChild(h('div', { class: 'daystamp' }, d)); }
          const bub = h('div', { class: 'bub ' + (m.kind || '') }, m.subj ? h('b', null, m.subj) : null, h('p', null, m.body), h('div', { class: 'tm' }, new Date(m.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })));
          if(m.act) bub.appendChild(h('button', { class: 'btn sm go', onclick: () => OS.open(m.act.app) }, m.act.label || 'Open'));
          th.appendChild(bub); OS.mail.read(m.id);
        });
        if(!msgs.length) A.pop();
        setTimeout(() => { pg.sc.scrollTop = pg.sc.scrollHeight; }, 30);
      }
      draw(); pg.liveOff = Kit.live('mail', () => { if(A.current === pg) draw(); });
    } });
  }
  paint(); Kit.live('mail', paint);
} });
</script></body></html>
