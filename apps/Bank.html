<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank</title>
<link rel="stylesheet" href="../os/tokens.css"><link rel="stylesheet" href="../os/app/kit.css">
<style>
.hero{ background:linear-gradient(155deg,#2a4778,#17284a 70%); color:#fff; border-radius:var(--r-xl); padding:22px 22px 20px; position:relative; overflow:hidden; box-shadow:var(--shadow); }
.hero::after{ content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%); }
.hero small{ opacity:.7; font:600 13px var(--font); letter-spacing:.04em; text-transform:uppercase; } .hero .bignum{ font-size:46px; margin:4px 0 2px; } .hero .nw{ opacity:.75; font:500 14px var(--font); }
.split{ display:flex; height:10px; border-radius:5px; overflow:hidden; margin:14px 0 8px; background:rgba(255,255,255,.15); } .split i{ display:block; height:100%; transition:width .6s var(--ease); }
.legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font:500 12.5px var(--font); opacity:.85; } .legend span::before{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--c); margin-right:6px; }
.bill{ border-radius:var(--r-l); padding:16px; background:linear-gradient(160deg,rgba(238,98,89,.2),rgba(238,98,89,.07)); box-shadow:inset 0 0 0 1px rgba(238,98,89,.4); margin-bottom:12px; }
.bill.ok{ background:var(--card); box-shadow:none; } .bill .amt{ font:700 30px/1 var(--font); letter-spacing:-.02em; } .bill .cd{ font:600 14px var(--font); color:var(--bad); } .bill .warn{ font:400 13px/1.4 var(--font); color:var(--label2); margin:8px 0 12px; }
.guest{ display:flex; gap:12px; align-items:center; background:var(--tint-dim); color:var(--tint); border-radius:var(--r-l); padding:12px 14px; margin-bottom:14px; font:500 14px/1.3 var(--font); }
.curve{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; } .curve div{ background:var(--fill); border-radius:12px; padding:10px 4px; } .curve b{ display:block; font:700 15px var(--font); } .curve small{ color:var(--label2); font:500 12px var(--font); }
.rk{ width:28px; text-align:center; font:700 15px var(--font); color:var(--label2); }
</style></head><body><div id="app"></div>
<script src="../os/icons.js"></script><script src="../os/app/kit.js"></script>
<script>
const { h, row, group, money, esc } = Kit, B = OS.bank;
const A = Kit.app({ title: 'Bank', build: (body, P) => {
  const guest = h('div'), hero = h('div'), taxSec = h('div'), actSec = h('div'), extra = h('div'); body.append(guest, hero, taxSec, actSec, extra);
  const COL = { cash: '#6ab0ff', inventory: '#e8b64f', stock: '#5cc06e', property: '#d98a5f' };
  let shown = 0, raf = 0;
  function countTo(el, to){ cancelAnimationFrame(raf); const from = shown, t0 = performance.now(); (function f(t){ const k = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - k, 3); shown = from + (to - from) * e; el.textContent = money(shown, { dp: 2 }); if(k < 1) raf = requestAnimationFrame(f); })(t0); }
  function paintHero(){
    const br = B.breakdown(), nw = B.netWorth(), tot = Math.max(1, br.cash + br.inventory + br.stock + br.property);
    if(!hero.firstChild){ hero.innerHTML = '<div class="hero"><small>Total balance</small><div class="bignum" data-b></div><div class="nw" data-n></div><div class="split" data-s></div><div class="legend" data-l></div></div>'; }
    countTo(hero.querySelector('[data-b]'), br.cash); hero.querySelector('[data-n]').textContent = 'Net worth ' + money(nw, { compact: true });
    hero.querySelector('[data-s]').innerHTML = Object.keys(COL).map(k => '<i style="width:' + (br[k] / tot * 100) + '%;background:' + COL[k] + '"></i>').join('');
    hero.querySelector('[data-l]').innerHTML = Object.keys(COL).map(k => '<span style="--c:' + COL[k] + '">' + k[0].toUpperCase() + k.slice(1) + ' ' + money(br[k], { compact: true }) + '</span>').join('');
  }
  function paintGuest(){ guest.innerHTML = ''; if(!OS.auth.signedIn()) guest.appendChild(h('div', { class: 'guest', onclick: () => OS.open('Settings') }, h('span', { html: Kit.icon('cloudOff', 22, 2) }), h('span', null, 'You’re not signed in, so your money isn’t saved. Click to sign in.'))); }
  function fmtLeft(ms){ if(ms <= 0) return 'overdue'; const h2 = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000); return (h2 ? h2 + 'h ' : '') + m + 'm ' + String(s).padStart(2, '0') + 's'; }
  let timers = [];
  function paintTax(){
    timers.forEach(clearInterval); timers = []; taxSec.innerHTML = ''; const cfg = B.config(), open = B.open();
    taxSec.appendChild(h('h2', { class: 'sec' }, 'Tax'));
    if(open.length){
      open.forEach(b => { const cd = h('span', { class: 'cd' }), card = h('div', { class: 'bill reveal' },
        h('div', { class: 'hstack', style: { justifyContent: 'space-between' } }, h('div', null, h('div', { class: 'dim', style: { fontSize: '13px', fontWeight: 600 } }, 'TAX BILL · ' + (b.rate * 100).toFixed(2) + '%'), h('div', { class: 'amt num' }, money(b.amt, { dp: 2 }))), cd),
        h('div', { class: 'warn' }, 'Unpaid at the deadline, the bank seizes assets worth double: ' + money(b.amt * cfg.seizeMultiple, { dp: 2 }) + '.'),
        h('button', { class: 'btn block bad', onclick: () => { const r = B.pay(b.id); Kit.toast(r.msg, r.ok ? 'good' : 'bad'); if(r.ok) paintAll(); } }, 'Pay ' + money(b.amt, { dp: 2 })));
        const upd = () => { cd.textContent = fmtLeft(b.due - OS.now()); }; upd(); timers.push(setInterval(upd, 1000)); taxSec.appendChild(card); });
      if(open.length > 1) taxSec.appendChild(h('button', { class: 'btn block tinted', onclick: () => { const n = B.payAll(); Kit.toast(n + ' bill' + (n === 1 ? '' : 's') + ' paid', 'good'); paintAll(); } }, 'Pay all (' + money(B.owed(), { dp: 2 }) + ')'));
    } else {
      const p = B.preview();
      taxSec.appendChild(h('div', { class: 'bill ok' }, h('div', { class: 'hstack' }, Kit.ico('shield', '#4e9a63', 36), h('div', { class: 'grow' }, h('b', null, 'Nothing to pay'), h('div', { class: 'sub' }, p.amount > 0 ? 'Tomorrow’s bill at your balance: about ' + money(p.amount, { dp: 2 }) + ' (' + (p.rate * 100).toFixed(2) + '%).' : 'You’re at or under ' + money(cfg.threshold) + ' — no tax applies.')))));
    }
    const rows = [100000, 200000, 500000, 1e6].map(c => '<div><b>' + (B.rate(c) * 100).toFixed(c < 3e5 ? 2 : 1) + '%</b><small>' + money(c, { compact: true }) + '</small></div>').join('');
    taxSec.appendChild(h('div', { class: 'card' }, h('b', null, 'How tax works'), h('p', { class: 'sub', style: { margin: '6px 0 12px' } }, 'Once a day, if your cash is above ' + money(cfg.threshold) + ', the bank sends a bill. The rate climbs exponentially the richer you are (capped at ' + (cfg.maxRate * 100) + '%). Miss the ' + cfg.dueHours + '-hour deadline and your stuff is seized.'), h('div', { class: 'curve', html: rows })));
    const past = B.bills().filter(b => b.status !== 'open').slice(0, 6);
    if(past.length){ taxSec.appendChild(h('h2', { class: 'sec' }, 'Past bills')); taxSec.appendChild(group(past.map(b => row({ title: money(b.amt, { dp: 2 }), sub: new Date(b.issued).toLocaleDateString() + (b.status === 'seized' ? ' · seized: ' + (b.seized || []).join(', ') : ''), right: h('span', { class: 'tag ' + (b.status === 'paid' ? 'good' : 'bad') }, b.status), wrap: true })))); }
  }
  function paintAct(){
    actSec.innerHTML = ''; const hist = B.history(); actSec.appendChild(h('h2', { class: 'sec' }, 'Activity'));
    actSec.appendChild(hist.length ? group(hist.slice(0, 15).map(x => row({ title: x.n || 'Transaction', sub: Kit.ago(x.t), right: h('span', { class: 'num ' + (x.d >= 0 ? 'up' : 'down') }, (x.d >= 0 ? '+' : '−') + money(Math.abs(x.d), { dp: 2 })) }))) : h('div', { class: 'card empty', style: { padding: '28px' } }, 'No transactions yet.'));
    extra.innerHTML = ''; extra.appendChild(h('h2', { class: 'sec' }, 'More')); extra.appendChild(group(row({ glyph: 'star', color: '#d9a441', title: 'Wealth ranking', sub: 'The richest players', chev: true, onClick: openRanking })));
  }
  function openRanking(){
    A.push({ title: 'Wealth ranking', backLabel: 'Bank', build: async (b) => {
      b.appendChild(h('div', { class: 'spin', style: { margin: '30px auto' } }));
      let list = []; try{ list = await B.ranking(25); }catch(e){} b.innerHTML = '';
      b.appendChild(list.length ? group(list.map((p, i) => row({ left: h('span', { class: 'rk' }, '#' + (i + 1)), title: p.name || 'Player', right: h('b', { class: 'num' }, money(p.value, { compact: true })) }))) : h('div', { class: 'empty' }, 'No one is on the board yet. Sign in and pick a display name in Settings to appear here.'));
    } });
  }
  function paintAll(){ paintGuest(); paintHero(); paintTax(); paintAct(); }
  paintAll(); ['cash', 'bank', 'inv', 'stock', 'props'].forEach(e => Kit.live(e, Kit.debounce(() => { paintHero(); if(e === 'bank') { paintTax(); } paintAct(); }, 80))); Kit.live('auth', paintGuest);
  P.destroy = () => timers.forEach(clearInterval);
} });
</script></body></html>
