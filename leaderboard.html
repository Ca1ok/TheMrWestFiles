<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — The Mr West Files</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav id="siteNav">
  <a href="index.html">Poster</a>
  <a href="coin.html">Coin Exchange</a>
  <a href="periodic.html">Periodic Table</a>
  <a href="market.html">Element Economy</a>
  <a href="leaderboard.html">Leaderboard</a>
  <a href="databook.html">Databook</a>
  <a href="settings.html">Settings</a>
</nav>
<div id="cookieBanner">
  <div class="cookie-text">
    We dont use cookies but you should still accept.
    By clicking "Accept All" you agree *Redacted*
  </div>
  <div class="cookie-btns">
    <button id="cookieReject">Reject All</button>
    <button id="cookieAccept" class="accept">Accept All</button>
  </div>
</div>

<div id="pages">
  <div class="region wide" id="region-leaderboard" data-role="satellite">
    <div class="region-inner">
      <div class="page-title">Investor Leaderboard</div>
      <div class="page-sub" id="lbStatus">Ranked by total portfolio value ($WEST held + cash)</div>

      <div class="name-picker" id="namePicker">
        <input type="text" id="nameInput" placeholder="Pick an investor name..." maxlength="20">
        <button class="nav-btn" id="nameSaveBtn" style="margin:0;">Save name</button>
      </div>
      <div class="name-msg" id="nameMsg"></div>

      <div id="leaderboardList"><div class="empty-history">No investors ranked yet.</div></div>
      <a class="nav-btn" href="index.html" style="margin-top:1.6rem;">Back to the board</a>
    </div>
  </div>
</div>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<!-- Data files, split out so app.js stays focused on behavior -->
<script src="data/wanted-data.js"></script>
<script src="data/periodic-table-data.js"></script>
<script src="data/databook-data.js"></script>
<script src="data/moderation-data.js"></script>
<script src="data/economy-data.js"></script>

<script src="app.js"></script>
</body>
</html>
